# SQL++ recipes — DATA source of truth (a YAML sequence of recipe records).
# n1k1 itself can query this:  n1k1 -c 'SELECT title, sqlpp FROM recipes' docs/recipes.yaml
# Rendered to recipes.md / recipes.html by docs/recipes_build.py; run it after editing.
# `python3 docs/recipes_build.py --check` runs every sqlpp against ./n1k1.
#
# Fields: section, title, note?, needs?(=shop), data?/bind?, out?, and one per dialect
# (sqlpp, sql, duckdb, js, python, mongo, jq). Source data is shown ONCE per recipe
# (data/bind) so every dialect just references a shared name — a fair comparison. For
# self-contained recipes, `bind` is the SQL++ `WITH <bind>` that binds that data.

# ============================================================ 1. collection
- section: '1. Querying a collection'
  title: 'Pick fields from each record'
  needs: 'shop'
  data: |-
    orders — the shop keyspace (20 docs), e.g.
    {"id":"1005","customer":"dave","total":22.0,"status":"shipped","ts":"2026-01-06"}
  out: |-
    {"id":"1005","status":"shipped","total":22.0}, … (one per order)
  sqlpp: |-
    SELECT o.id, o.status, o.total
    FROM orders o
  sql: |-
    SELECT id, status, total FROM orders
  duckdb: |-
    SELECT id, status, total FROM orders
  js: |-
    orders.map(o => ({id: o.id, status: o.status, total: o.total}))
  python: |-
    [{"id": o["id"], "status": o["status"], "total": o["total"]} for o in orders]
  mongo: |-
    db.orders.find({}, {id: 1, status: 1, total: 1, _id: 0})
  jq: |-
    .[] | {id, status, total}

- section: '1. Querying a collection'
  title: 'Keep matching records'
  needs: 'shop'
  out: |-
    the orders with total over 100
  sqlpp: |-
    SELECT o.id, o.total
    FROM orders o
    WHERE o.total > 100
  sql: |-
    SELECT id, total FROM orders WHERE total > 100
  duckdb: |-
    SELECT id, total FROM orders WHERE total > 100
  js: |-
    orders.filter(o => o.total > 100)
  python: |-
    [o for o in orders if o["total"] > 100]
  mongo: |-
    db.orders.find({total: {$gt: 100}})
  jq: |-
    map(select(.total > 100))

- section: '1. Querying a collection'
  title: 'Sort, then take the top N'
  needs: 'shop'
  out: |-
    {"id":"1020","total":389.99}, {"id":"1019","total":245.0}, {"id":"1003","total":210.00}
  sqlpp: |-
    SELECT o.id, o.total
    FROM orders o
    ORDER BY o.total DESC
    LIMIT 3
  sql: |-
    SELECT id, total FROM orders ORDER BY total DESC LIMIT 3
  duckdb: |-
    SELECT id, total FROM orders ORDER BY total DESC LIMIT 3
  js: |-
    orders.toSorted((a, b) => b.total - a.total).slice(0, 3)
  python: |-
    sorted(orders, key=lambda o: -o["total"])[:3]
  mongo: |-
    db.orders.find().sort({total: -1}).limit(3)
  jq: |-
    sort_by(.total) | reverse | .[:3]

- section: '1. Querying a collection'
  title: 'The single largest record'
  note: |-
    jq's max_by returns the whole record with the largest key; in SQL it's ORDER BY … LIMIT 1.
  needs: 'shop'
  out: |-
    the priciest order (the whole row)
  sqlpp: |-
    SELECT o.*
    FROM orders o
    ORDER BY o.total DESC
    LIMIT 1
  sql: |-
    SELECT * FROM orders ORDER BY total DESC LIMIT 1
  duckdb: |-
    SELECT max_by(orders, total) FROM orders
  js: |-
    orders.reduce((m, o) => o.total > m.total ? o : m)
  python: |-
    max(orders, key=lambda o: o["total"])
  mongo: |-
    db.orders.find().sort({total: -1}).limit(1)
  jq: |-
    max_by(.total)

- section: '1. Querying a collection'
  title: 'Count and total a collection'
  needs: 'shop'
  out: |-
    {"n":20,"revenue":1949.36,"avg":97.47}
  sqlpp: |-
    SELECT COUNT(*)               AS n,
           ROUND(SUM(o.total), 2) AS revenue,
           ROUND(AVG(o.total), 2) AS avg
    FROM orders o
  sql: |-
    SELECT count(*), round(sum(total),2), round(avg(total),2) FROM orders
  duckdb: |-
    SELECT count(*), round(sum(total),2), round(avg(total),2) FROM orders
  js: |-
    ({n: orders.length, revenue: orders.reduce((s, o) => s + o.total, 0)})
  python: |-
    {"n": len(orders), "revenue": sum(o["total"] for o in orders)}
  mongo: |-
    db.orders.aggregate([{$group: {_id: null, n: {$sum: 1}, revenue: {$sum: "$total"}, avg: {$avg: "$total"}}}])
  jq: |-
    {n: length, revenue: (map(.total) | add)}

- section: '1. Querying a collection'
  title: 'Group, then aggregate each group'
  needs: 'shop'
  out: |-
    {"status":"shipped","n":16,"revenue":1758.73}, {"status":"pending",…}, {"status":"cancelled",…}
  sqlpp: |-
    SELECT o.status, COUNT(*) AS n,
           ROUND(SUM(o.total), 2) AS revenue
    FROM orders o
    GROUP BY o.status
    ORDER BY revenue DESC
  sql: |-
    SELECT status, count(*), round(sum(total),2)
    FROM orders GROUP BY status ORDER BY 3 DESC
  duckdb: |-
    SELECT status, count(*), round(sum(total),2)
    FROM orders GROUP BY status ORDER BY 3 DESC
  js: |-
    Object.groupBy(orders, o => o.status)   // then reduce each bucket
  python: |-
    df.groupby("status").total.agg(["count", "sum"])   # pandas
  mongo: |-
    db.orders.aggregate([
      {$group: {_id: "$status", n: {$sum: 1}, revenue: {$sum: "$total"}}},
      {$sort: {revenue: -1}}])
  jq: |-
    group_by(.status)   # → array of arrays

- section: '1. Querying a collection'
  title: 'RAW — one bare value per row (not an object)'
  note: |-
    A normal SELECT yields objects; SELECT RAW (jq's .[] | .field) yields the bare value —
    handy for one column, an IN-list, or feeding another query.
  needs: 'shop'
  out: |-
    "dave", "alice", …  (bare strings, not {"customer":…})
  sqlpp: |-
    SELECT RAW o.customer
    FROM orders o
  sql: |-
    SELECT customer FROM orders     -- a single-column result set
  duckdb: |-
    SELECT customer FROM orders
  js: |-
    orders.map(o => o.customer)
  python: |-
    [o["customer"] for o in orders]
  mongo: |-
    db.orders.distinct("customer")  // bare values (also dedups)
  jq: |-
    .[] | .customer

# ============================================================ 2. reach in
- section: '2. Reaching into a value'
  title: 'Field access, including nested'
  data: |-
    doc = {"id": "o1", "customer": {"name": "Dave", "city": "Austin"}}
  bind: |-
    doc AS ({"id":"o1","customer":{"name":"Dave","city":"Austin"}})
  out: |-
    {"city":"Austin"}
  sqlpp: |-
    SELECT doc.customer.city
  sql: |-
    SELECT col->'customer'->>'city'       -- ->> text, -> jsonb
  duckdb: |-
    SELECT doc->'$.customer.city'
  js: |-
    doc.customer.city
  python: |-
    doc["customer"]["city"]
  mongo: |-
    db.c.find({}, {"customer.city": 1})
  jq: |-
    .customer.city

- section: '2. Reaching into a value'
  title: 'A missing field is MISSING (not an error)'
  note: |-
    jq's ? suppresses errors on non-objects; SQL++ has no error — a missing path is MISSING
    and simply drops out of the result (see "MISSING vs NULL" at the end).
  data: |-
    doc = {"bar": 1}
  bind: |-
    doc AS ({"bar":1})
  out: |-
    {}   (foo is MISSING → the key is omitted)
  sqlpp: |-
    SELECT doc.foo
  sql: |-
    SELECT col->'foo'      -- NULL if absent
  duckdb: |-
    SELECT doc->'$.foo'
  js: |-
    doc.foo               // undefined
  python: |-
    doc.get("foo")        # None
  mongo: |-
    // a missing field is simply absent from the result
  jq: |-
    .foo?                 # no error even on a non-object

- section: '2. Reaching into a value'
  title: 'Array index — 0-based, negatives from the end'
  data: |-
    nums = [10, 20, 30]
  bind: |-
    nums AS ([10,20,30])
  out: |-
    {"first":10,"last":30,"penult":20}
  sqlpp: |-
    SELECT nums[0]  AS `first`,
           nums[-1] AS `last`,
           nums[-2] AS penult
  sql: |-
    col->0, col->-1        -- jsonb: 0-based, -1 = last
  duckdb: |-
    nums[1], nums[-1]      -- ⚠ DuckDB lists are 1-based
  js: |-
    nums[0]; nums.at(-1)
  python: |-
    nums[0]; nums[-1]
  mongo: |-
    {$arrayElemAt: ["$nums", -1]}
  jq: |-
    .[0], .[-1]

- section: '2. Reaching into a value'
  title: 'Slice a range'
  data: |-
    letters = ["a", "b", "c", "d", "e"]
  bind: |-
    letters AS (["a","b","c","d","e"])
  out: |-
    {"s":["c","d"]}
  sqlpp: |-
    SELECT letters[2:4] AS s
  sql: |-
    jsonb_path_query(col, '$[2 to 3]')     -- SQLite has no slice
  duckdb: |-
    letters[3:4]           -- ⚠ 1-based, inclusive
  js: |-
    letters.slice(2, 4)
  python: |-
    letters[2:4]
  mongo: |-
    {$slice: ["$letters", 2, 2]}
  jq: |-
    .[2:4]

# ============================================================ 3. arrays
- section: '3. Transforming arrays'
  title: 'map — transform every element'
  note: |-
    SQL++ has two forms: a scan (SELECT … FROM nums) or the inline array comprehension
    ARRAY … FOR … END that returns one array value.
  data: |-
    nums = [1, 2, 3]
  bind: |-
    nums AS ([1,2,3])
  out: |-
    {"r":[2,3,4]}
  sqlpp: |-
    SELECT ARRAY v + 1 FOR v IN nums END AS r
  sql: |-
    SELECT jsonb_agg(value::int + 1) FROM jsonb_array_elements(col)
  duckdb: |-
    SELECT [x + 1 for x in nums]
  js: |-
    nums.map(x => x + 1)
  python: |-
    [x + 1 for x in nums]
  mongo: |-
    {$map: {input: "$nums", as: "v", in: {$add: ["$$v", 1]}}}
  jq: |-
    map(. + 1)

- section: '3. Transforming arrays'
  title: 'filter — keep matching elements'
  data: |-
    nums = [1, 5, 3, 0, 7]
  bind: |-
    nums AS ([1,5,3,0,7])
  out: |-
    5, 3, 7
  sqlpp: |-
    SELECT RAW v
    FROM nums AS v
    WHERE v >= 2
  sql: |-
    SELECT value FROM jsonb_array_elements(col) WHERE value::int >= 2
  duckdb: |-
    SELECT [x for x in nums if x >= 2]
  js: |-
    nums.filter(x => x >= 2)
  python: |-
    [x for x in nums if x >= 2]
  mongo: |-
    {$filter: {input: "$nums", cond: {$gte: ["$$this", 2]}}}
  jq: |-
    map(select(. >= 2))

- section: '3. Transforming arrays'
  title: 'Sum, min, max, average'
  data: |-
    nums = [1, 2, 3]
  bind: |-
    nums AS ([1,2,3])
  out: |-
    {"s":6,"mx":3,"a":2}
  sqlpp: |-
    SELECT ARRAY_SUM(nums) AS s,
           ARRAY_MAX(nums) AS mx,
           ARRAY_AVG(nums) AS a
  sql: |-
    sum(value::int) FROM jsonb_array_elements(col)
  duckdb: |-
    list_sum(nums); list_max(nums); list_avg(nums)
  js: |-
    nums.reduce((a, b) => a + b, 0); Math.max(...nums)
  python: |-
    sum(nums); max(nums); statistics.mean(nums)
  mongo: |-
    {$sum: "$nums"}; {$max: "$nums"}; {$avg: "$nums"}
  jq: |-
    add; max; (add / length)

- section: '3. Transforming arrays'
  title: 'Length / count of elements'
  data: |-
    nums = [1, 2, 3]
  bind: |-
    nums AS ([1,2,3])
  out: |-
    {"n":3}
  sqlpp: |-
    SELECT ARRAY_LENGTH(nums) AS n
  sql: |-
    jsonb_array_length(col)
  duckdb: |-
    len(nums)
  js: |-
    nums.length
  python: |-
    len(nums)
  mongo: |-
    {$size: "$nums"}
  jq: |-
    length

- section: '3. Transforming arrays'
  title: 'Unique / dedup'
  note: |-
    ARRAY_DISTINCT keeps first-seen order; wrap in ARRAY_SORT for jq's sorted result.
  data: |-
    nums = [1, 2, 5, 3, 5, 3, 1]
  bind: |-
    nums AS ([1,2,5,3,5,3,1])
  out: |-
    {"u":[1,2,5,3]}
  sqlpp: |-
    SELECT ARRAY_DISTINCT(nums) AS u
  sql: |-
    SELECT DISTINCT value FROM jsonb_array_elements(col)
  duckdb: |-
    list_distinct(nums)
  js: |-
    [...new Set(nums)]
  python: |-
    list(dict.fromkeys(nums))
  mongo: |-
    {$setUnion: ["$nums", []]}   // unordered
  jq: |-
    unique   # sorted

- section: '3. Transforming arrays'
  title: 'Flatten nested arrays'
  note: |-
    ⚠ SQL++ ARRAY_FLATTEN needs an explicit depth; jq flattens fully.
  data: |-
    nested = [1, [2], [[3]]]
  bind: |-
    nested AS ([1,[2],[[3]]])
  out: |-
    {"f":[1,2,3]}
  sqlpp: |-
    SELECT ARRAY_FLATTEN(nested, 2) AS f
  sql: |-
    -- recursive unnest; no single builtin
  duckdb: |-
    flatten(nested)        -- one level
  js: |-
    nested.flat(2)
  python: |-
    # no deep builtin; recurse
  mongo: |-
    {$reduce: {input: "$nested", initialValue: [], in: {$concatArrays: ["$$value", "$$this"]}}}  // one level
  jq: |-
    flatten

- section: '3. Transforming arrays'
  title: 'reverse · range · append · concat'
  out: |-
    {"rev":[3,2,1],"rng":[2,3],"app":[1,2,3],"cat":[1,2]}
  sqlpp: |-
    SELECT ARRAY_REVERSE([1,2,3]) AS rev,
           ARRAY_RANGE(2, 4)      AS rng,
           ARRAY_APPEND([1,2], 3) AS app,
           ARRAY_CONCAT([1], [2]) AS cat
  sql: |-
    a || b ; generate_series(2, 3)
  duckdb: |-
    list_reverse(a); range(2,4); list_append(a,x); list_concat(a,b)
  js: |-
    a.toReversed(); [...Array(2).keys()].map(i=>i+2); [...a, x]; a.concat(b)
  python: |-
    a[::-1]; list(range(2,4)); a + [x]; a + b
  mongo: |-
    {$reverseArray}; {$range:[2,4]}; {$concatArrays}
  jq: |-
    reverse; [range(2;4)]; . + [x]; .a + .b

- section: '3. Transforming arrays'
  title: 'Every other element'
  note: |-
    Index by a stepped range (OBJECT_PAIRS works on objects only, not arrays).
  data: |-
    letters = ["a", "b", "c", "d"]
  bind: |-
    letters AS (["a","b","c","d"])
  out: |-
    {"evens":["a","c"]}
  sqlpp: |-
    SELECT ARRAY letters[i]
           FOR i IN ARRAY_RANGE(0, ARRAY_LENGTH(letters), 2) END AS evens
  sql: |-
    … WITH ORDINALITY t(v, i) WHERE i % 2 = 1
  duckdb: |-
    list_slice(letters, 1, 4, 2)   -- 1-based, step 2
  js: |-
    letters.filter((_, i) => i % 2 === 0)
  python: |-
    letters[::2]
  mongo: |-
    {$map: {input: {$range: [0, {$size: "$letters"}, 2]}, in: {$arrayElemAt: ["$letters", "$$this"]}}}
  jq: |-
    [range(0; length; 2) as $i | .[$i]]

- section: '3. Transforming arrays'
  title: 'Chunk into fixed-size groups'
  note: |-
    ⚠ Clamp the slice end with LEAST(…, ARRAY_LENGTH(a)) — a slice past the end is MISSING
    and would drop the last short chunk.
  data: |-
    nums = [1, 2, 3, 4, 5]
  bind: |-
    nums AS ([1,2,3,4,5])
  out: |-
    {"chunks":[[1,2],[3,4],[5]]}
  sqlpp: |-
    SELECT ARRAY nums[i:LEAST(i + 2, ARRAY_LENGTH(nums))]
           FOR i IN ARRAY_RANGE(0, ARRAY_LENGTH(nums), 2) END AS chunks
  sql: |-
    -- window / ntile, or generate_series with slicing
  duckdb: |-
    [nums[i+1 : i+2] for i in range(0, len(nums), 2)]
  js: |-
    Array.from({length: Math.ceil(nums.length/2)}, (_, i) => nums.slice(i*2, i*2+2))
  python: |-
    [nums[i:i+2] for i in range(0, len(nums), 2)]
  mongo: |-
    —
  jq: |-
    [range(0; length; 2) as $i | .[$i:$i+2]]

# ============================================================ 4. iterate/collect
- section: '4. Iterating & collecting'
  title: 'Visit each element'
  data: |-
    people = [{"name": "JSON"}, {"name": "XML"}]
  bind: |-
    people AS ([{"name":"JSON"},{"name":"XML"}])
  out: |-
    {"name":"JSON"} then {"name":"XML"}
  sqlpp: |-
    SELECT p.*
    FROM people AS p
  sql: |-
    SELECT value FROM jsonb_array_elements(col)
  duckdb: |-
    SELECT unnest(people, recursive := false)
  js: |-
    for (const p of people) { … }
  python: |-
    for p in people: ...
  mongo: |-
    db.people.find()
  jq: |-
    .[]

- section: '4. Iterating & collecting'
  title: 'One field from each element'
  data: |-
    people = [{"name": "JSON"}, {"name": "XML"}]
  bind: |-
    people AS ([{"name":"JSON"},{"name":"XML"}])
  out: |-
    "JSON", "XML"
  sqlpp: |-
    SELECT RAW p.name
    FROM people AS p
  sql: |-
    SELECT e->>'name' FROM jsonb_array_elements(col) e
  duckdb: |-
    SELECT p.name FROM (SELECT unnest(people) p)
  js: |-
    people.map(p => p.name)
  python: |-
    [p["name"] for p in people]
  mongo: |-
    db.people.find({}, {name: 1, _id: 0})
  jq: |-
    .[] | .name

- section: '4. Iterating & collecting'
  title: 'Collect values into one array'
  data: |-
    doc = {"user": "s", "projects": ["jq", "wf"]}
  bind: |-
    doc AS ({"user":"s","projects":["jq","wf"]})
  out: |-
    {"r":["s","jq","wf"]}
  sqlpp: |-
    SELECT ARRAY_PREPEND(doc.user, doc.projects) AS r
  sql: |-
    col->'user' || col->'projects'    -- jsonb || concatenates
  duckdb: |-
    list_prepend(doc.user, doc.projects)
  js: |-
    [doc.user, ...doc.projects]
  python: |-
    [doc["user"], *doc["projects"]]
  mongo: |-
    {$concatArrays: [["$user"], "$projects"]}
  jq: |-
    [.user, .projects[]]

# ============================================================ 5. objects
- section: '5. Building & reshaping objects'
  title: 'Build an object'
  note: |-
    Keys inside a constructed object render sorted (canonical JSON): title before user.
  data: |-
    doc = {"user": "s", "title": "JQ"}
  bind: |-
    doc AS ({"user":"s","title":"JQ"})
  out: |-
    {"o":{"title":"JQ","user":"s"}}
  sqlpp: |-
    SELECT {"user": doc.user, "title": doc.title} AS o
  sql: |-
    jsonb_build_object('user', col->'user', 'title', col->'title')
  duckdb: |-
    {'user': doc.user, 'title': doc.title}   -- a STRUCT
  js: |-
    ({user: doc.user, title: doc.title})
  python: |-
    {"user": doc["user"], "title": doc["title"]}
  mongo: |-
    {$project: {user: 1, title: 1, _id: 0}}
  jq: |-
    {user, title}

- section: '5. Building & reshaping objects'
  title: "List an object's keys"
  data: |-
    obj = {"b": 2, "a": 1}
  bind: |-
    obj AS ({"b":2,"a":1})
  out: |-
    {"k":["a","b"]}
  sqlpp: |-
    SELECT OBJECT_NAMES(obj) AS k
  sql: |-
    jsonb_object_keys(col)   -- one row per key
  duckdb: |-
    json_keys(obj)
  js: |-
    Object.keys(obj)
  python: |-
    list(obj.keys())
  mongo: |-
    {$map: {input: {$objectToArray: "$obj"}, in: "$$this.k"}}
  jq: |-
    keys   # sorted

- section: '5. Building & reshaping objects'
  title: 'Object → array of pairs'
  note: |-
    ⚠ SQL++ OBJECT_PAIRS yields {name, val}; jq yields {key, value}.
  data: |-
    obj = {"a": 1, "b": 2}
  bind: |-
    obj AS ({"a":1,"b":2})
  out: |-
    {"p":[{"name":"a","val":1},{"name":"b","val":2}]}
  sqlpp: |-
    SELECT OBJECT_PAIRS(obj) AS p
  sql: |-
    jsonb_each(col)   -- rows (key, value)
  duckdb: |-
    map_entries(obj)
  js: |-
    Object.entries(obj)   // [["a",1],["b",2]]
  python: |-
    list(obj.items())
  mongo: |-
    {$objectToArray: "$obj"}   // [{k,v}]
  jq: |-
    to_entries   # [{key,value}]

- section: '5. Building & reshaping objects'
  title: 'Pairs → object'
  data: |-
    pairs = [{"name": "a", "val": 1}]
  bind: |-
    pairs AS ([{"name":"a","val":1}])
  out: |-
    {"o":{"a":1}}
  sqlpp: |-
    SELECT OBJECT p.name : p.val FOR p IN pairs END AS o
  sql: |-
    jsonb_object_agg(e->>'key', e->'value')
  duckdb: |-
    map_from_entries(pairs)
  js: |-
    Object.fromEntries(pairs.map(p => [p.name, p.val]))
  python: |-
    {p["name"]: p["val"] for p in pairs}
  mongo: |-
    {$arrayToObject: "$pairs"}
  jq: |-
    from_entries

- section: '5. Building & reshaping objects'
  title: 'Object with a key from the data'
  note: |-
    ⚠ Keys must be strings; `value` is a reserved word (back-quoted).
  data: |-
    recs = [{"label": "a", "value": 1}]
  bind: |-
    recs AS ([{"label":"a","value":1}])
  out: |-
    {"o":{"a":1}}
  sqlpp: |-
    SELECT OBJECT r.label : r.`value` FOR r IN recs END AS o
  sql: |-
    jsonb_object_agg(e->>'label', e->'value')
  duckdb: |-
    map_from_entries([{'k': r.label, 'v': r.value} for r in recs])
  js: |-
    Object.fromEntries(recs.map(r => [r.label, r.value]))
  python: |-
    {r["label"]: r["value"] for r in recs}
  mongo: |-
    {$arrayToObject: {$map: {input: "$recs", in: {k: "$$this.label", v: "$$this.value"}}}}
  jq: |-
    map({(.label): .value}) | add

- section: '5. Building & reshaping objects'
  title: 'Transform every value, keep keys'
  data: |-
    obj = {"a": 1, "b": 2}
  bind: |-
    obj AS ({"a":1,"b":2})
  out: |-
    {"o":{"a":2,"b":3}}
  sqlpp: |-
    SELECT OBJECT p.name : p.val + 1 FOR p IN OBJECT_PAIRS(obj) END AS o
  sql: |-
    jsonb_object_agg(k, (v::int)+1) FROM jsonb_each(obj) e(k,v)
  duckdb: |-
    map_from_entries([{'k': e.key, 'v': e.value + 1} for e in map_entries(obj)])
  js: |-
    Object.fromEntries(Object.entries(obj).map(([k, v]) => [k, v + 1]))
  python: |-
    {k: v + 1 for k, v in obj.items()}
  mongo: |-
    {$arrayToObject: {$map: {input: {$objectToArray: "$obj"}, in: {k: "$$this.k", v: {$add: ["$$this.v", 1]}}}}}
  jq: |-
    map_values(. + 1)

- section: '5. Building & reshaping objects'
  title: 'Swap keys and values'
  data: |-
    obj = {"a": 1, "b": 2}
  bind: |-
    obj AS ({"a":1,"b":2})
  out: |-
    {"o":{"1":"a","2":"b"}}
  sqlpp: |-
    SELECT OBJECT TO_STRING(p.val) : p.name FOR p IN OBJECT_PAIRS(obj) END AS o
  sql: |-
    jsonb_object_agg(v#>>'{}', k) FROM jsonb_each(obj) e(k,v)
  duckdb: |-
    map_from_entries([{'k': e.value::VARCHAR, 'v': e.key} for e in map_entries(obj)])
  js: |-
    Object.fromEntries(Object.entries(obj).map(([k, v]) => [v, k]))
  python: |-
    {str(v): k for k, v in obj.items()}
  mongo: |-
    {$arrayToObject: {$map: {input: {$objectToArray: "$obj"}, in: {k: {$toString: "$$this.v"}, v: "$$this.k"}}}}
  jq: |-
    to_entries | map({(.value): .key}) | add

- section: '5. Building & reshaping objects'
  title: 'Add / remove a field'
  data: |-
    obj = {"title": "x", "a": 1}
  bind: |-
    obj AS ({"title":"x","a":1})
  out: |-
    {"added":{"a":1,"draft":true,"title":"x"},"removed":{"a":1}}
  sqlpp: |-
    SELECT OBJECT_ADD(obj, "draft", true) AS added,
           OBJECT_REMOVE(obj, "title")    AS removed
  sql: |-
    col || '{"draft":true}'   |   col - 'title'
  duckdb: |-
    struct_insert(obj, draft := true)   |   obj.* EXCLUDE (title)
  js: |-
    ({...obj, draft: true})   |   (({title, ...rest}) => rest)(obj)
  python: |-
    {**obj, "draft": True}   |   {k: v for k, v in obj.items() if k != "title"}
  mongo: |-
    {$mergeObjects: ["$$ROOT", {draft: true}]}   |   {$unset: "title"}
  jq: |-
    . + {draft: true}   |   del(.title)

- section: '5. Building & reshaping objects'
  title: 'Object → array of objects (key becomes a field)'
  data: |-
    obj = {"x": {"n": 1}}
  bind: |-
    obj AS ({"x":{"n":1}})
  out: |-
    {"a":[{"n":1,"slug":"x"}]}
  sqlpp: |-
    SELECT ARRAY OBJECT_ADD(p.val, "slug", p.name)
           FOR p IN OBJECT_PAIRS(obj) END AS a
  sql: |-
    jsonb_agg(v || jsonb_build_object('slug', k))
  duckdb: |-
    [struct_insert(e.value, slug := e.key) for e in map_entries(obj)]
  js: |-
    Object.entries(obj).map(([k, v]) => ({...v, slug: k}))
  python: |-
    [{**v, "slug": k} for k, v in obj.items()]
  mongo: |-
    {$map: {input: {$objectToArray: "$obj"}, in: {$mergeObjects: ["$$this.v", {slug: "$$this.k"}]}}}
  jq: |-
    to_entries | map(.value + {slug: .key})

- section: '5. Building & reshaping objects'
  title: 'Array of objects → object keyed by a field'
  data: |-
    recs = [{"slug": "x", "n": 1}]
  bind: |-
    recs AS ([{"slug":"x","n":1}])
  out: |-
    {"o":{"x":{"n":1,"slug":"x"}}}
  sqlpp: |-
    SELECT OBJECT r.slug : r FOR r IN recs END AS o
  sql: |-
    jsonb_object_agg(e->>'slug', e)
  duckdb: |-
    map_from_entries([{'k': r.slug, 'v': r} for r in recs])
  js: |-
    Object.fromEntries(recs.map(r => [r.slug, r]))
  python: |-
    {r["slug"]: r for r in recs}
  mongo: |-
    {$arrayToObject: {$map: {input: "$recs", in: {k: "$$this.slug", v: "$$this"}}}}
  jq: |-
    map({(.slug): .}) | add

# ============================================================ 6. aggregate deeper
- section: '6. Aggregating a collection'
  title: "Collect each group's members"
  needs: 'shop'
  out: |-
    one row per customer, e.g. {"customer":"dave","order_ids":["1005","1009","1013","1017"]}
  sqlpp: |-
    SELECT o.customer, ARRAY_AGG(o.id) AS order_ids
    FROM orders o
    GROUP BY o.customer
  sql: |-
    SELECT customer, jsonb_agg(id) FROM orders GROUP BY customer
  duckdb: |-
    SELECT customer, list(id) FROM orders GROUP BY customer
  js: |-
    Object.groupBy(orders, o => o.customer)   // then map ids
  python: |-
    {c: [o["id"] for o in g] for c, g in groupby(sorted(orders, key=k), k)}
  mongo: |-
    db.orders.aggregate([{$group: {_id: "$customer", order_ids: {$push: "$id"}}}])
  jq: |-
    group_by(.customer) | map({customer: .[0].customer, ids: map(.id)})

- section: '6. Aggregating a collection'
  title: 'Count occurrences (histogram)'
  data: |-
    tags = ["a", "b", "a"]
  bind: |-
    tags AS (["a","b","a"])
  out: |-
    {"value":"a","n":2}, {"value":"b","n":1}
  sqlpp: |-
    SELECT v AS `value`, COUNT(*) AS n
    FROM tags AS v
    GROUP BY v
  sql: |-
    SELECT value, count(*) FROM jsonb_array_elements_text(col) GROUP BY value
  duckdb: |-
    SELECT v, count(*) FROM (SELECT unnest(tags) v) GROUP BY v
  js: |-
    tags.reduce((m, x) => (m[x] = (m[x] || 0) + 1, m), {})
  python: |-
    collections.Counter(tags)
  mongo: |-
    [{$unwind: "$tags"}, {$group: {_id: "$tags", n: {$sum: 1}}}]
  jq: |-
    reduce .[] as $x ({}; .[$x] += 1)

- section: '6. Aggregating a collection'
  title: 'Find duplicates by key'
  needs: 'shop'
  out: |-
    (empty for shop — order ids are unique)
  sqlpp: |-
    SELECT o.id, COUNT(*) AS n
    FROM orders o
    GROUP BY o.id
    HAVING COUNT(*) > 1
  sql: |-
    SELECT id, count(*) FROM orders GROUP BY id HAVING count(*) > 1
  duckdb: |-
    SELECT id, count(*) FROM orders GROUP BY id HAVING count(*) > 1
  js: |-
    // group by id, then keep buckets with length > 1
  python: |-
    [k for k, c in Counter(o["id"] for o in orders).items() if c > 1]
  mongo: |-
    [{$group: {_id: "$id", n: {$sum: 1}}}, {$match: {n: {$gt: 1}}}]
  jq: |-
    reduce .[].id as $x ({}; .[$x] += 1) | to_entries[] | select(.value > 1)

# ============================================================ 7. strings & numbers
- section: '7. Strings & numbers'
  title: 'split / join'
  out: |-
    {"parts":["a","b","c"],"joined":"a-b-c"}
  sqlpp: |-
    SELECT SPLIT("a,b,c", ",")         AS parts,
           CONCAT2("-", ["a","b","c"]) AS joined
  sql: |-
    string_to_array('a,b,c', ','); array_to_string(a, '-')
  duckdb: |-
    string_split('a,b,c', ','); array_to_string(['a','b','c'], '-')
  js: |-
    "a,b,c".split(","); ["a","b","c"].join("-")
  python: |-
    "a,b,c".split(","); "-".join(["a","b","c"])
  mongo: |-
    {$split: ["a,b,c", ","]}; {$reduce: …}   // no direct join
  jq: |-
    split(","); join("-")

- section: '7. Strings & numbers'
  title: 'upcase / trim-prefix / titlecase'
  out: |-
    {"up":"ABC","trimmed":"bar","titled":"Hi There"}
  sqlpp: |-
    SELECT UPPER("abc")           AS up,
           LTRIM("foobar", "foo") AS trimmed,
           TITLE("hi there")      AS titled
  sql: |-
    upper(s); ltrim(s, 'foo'); initcap(s)
  duckdb: |-
    upper(s); ltrim(s, 'foo')
  js: |-
    s.toUpperCase(); s.replace(/^foo/, "")
  python: |-
    s.upper(); s.removeprefix("foo"); s.title()
  mongo: |-
    {$toUpper: "$s"}; {$ltrim: {input: "$s", chars: "foo"}}
  jq: |-
    ascii_upcase; ltrimstr("foo")

- section: '7. Strings & numbers'
  title: 'String interpolation'
  out: |-
    {"msg":"total is 3"}
  sqlpp: |-
    SELECT "total is " || TO_STRING(1 + 2) AS msg
  sql: |-
    'total is ' || (1 + 2)::text
  duckdb: |-
    printf('total is %d', 1 + 2)
  js: |-
    `total is ${1 + 2}`
  python: |-
    f"total is {1 + 2}"
  mongo: |-
    {$concat: ["total is ", {$toString: {$add: [1, 2]}}]}
  jq: |-
    "total is \(. + 1)"

- section: '7. Strings & numbers'
  title: 'Index of a substring'
  note: |-
    ⚠ SQL++ POSITION is 0-based; Postgres/DuckDB are 1-based.
  out: |-
    {"i":1}
  sqlpp: |-
    SELECT POSITION("a, b", ", ") AS i
  sql: |-
    position(', ' in 'a, b') - 1
  duckdb: |-
    strpos('a, b', ', ') - 1
  js: |-
    "a, b".indexOf(", ")
  python: |-
    "a, b".find(", ")
  mongo: |-
    {$indexOfCP: ["a, b", ", "]}
  jq: |-
    index(", ")

- section: '7. Strings & numbers'
  title: 'floor / round / sqrt / integer-divide'
  out: |-
    {"fl":3,"rnd":3.14,"sq":3,"idiv":3}
  sqlpp: |-
    SELECT FLOOR(3.7)        AS fl,
           ROUND(3.14159, 2) AS rnd,
           SQRT(9)           AS sq,
           IDIV(7, 2)        AS idiv
  sql: |-
    floor(x); round(x, 2); sqrt(x); div(7, 2)
  duckdb: |-
    floor(x); round(x, 2); sqrt(x); 7 // 2
  js: |-
    Math.floor(x); +x.toFixed(2); Math.sqrt(x); Math.trunc(7/2)
  python: |-
    math.floor(x); round(x, 2); math.sqrt(x); 7 // 2
  mongo: |-
    {$floor}; {$round: [x, 2]}; {$sqrt}; {$trunc: {$divide: [7, 2]}}
  jq: |-
    floor; sqrt; (7 / 2 | floor)

- section: '7. Strings & numbers'
  title: 'Name the JSON type'
  note: |-
    ⚠ SQL++ TYPE() is lowercase and distinguishes "missing" from "null".
  data: |-
    vals = [0, false, [], {}, null, "x"]
  bind: |-
    vals AS ([0,false,[],{},null,"x"])
  out: |-
    {"t":["number","boolean","array","object","null","string"]}
  sqlpp: |-
    SELECT ARRAY TYPE(v) FOR v IN vals END AS t
  sql: |-
    jsonb_typeof(value)
  duckdb: |-
    typeof(v); json_type(j)
  js: |-
    typeof x; Array.isArray(x)
  python: |-
    type(x).__name__
  mongo: |-
    {$type: "$x"}
  jq: |-
    type   # (jq has no "missing")

# ============================================================ 8. recursion
- section: '8. Recursion & deep search'
  title: 'Recurse into every descendant'
  note: |-
    SQL++'s answer to jq's .. is the WITHIN operator (descend into any nested value).
    Postgres uses jsonpath ($..); DuckDB/JS/Python/Mongo have no one-liner — you recurse.
  data: |-
    tree = {"a": 0, "b": [1]}
  bind: |-
    tree AS ({"a":0,"b":[1]})
  out: |-
    {"descendants":[0,[1],1]}
  sqlpp: |-
    SELECT ARRAY v FOR v WITHIN tree END AS descendants
  sql: |-
    jsonb_path_query(col, '$..*')
  duckdb: |-
    —
  js: |-
    function* walk(x){ yield x; if (x && typeof x=="object") for (const v of Object.values(x)) yield* walk(v) }
  python: |-
    # recursive generator over dict/list values
  mongo: |-
    —
  jq: |-
    ..

- section: '8. Recursion & deep search'
  title: 'Does a value appear anywhere in the tree?'
  data: |-
    tree = {"a": {"b": 5}}
  bind: |-
    tree AS ({"a":{"b":5}})
  out: |-
    {"found":true}
  sqlpp: |-
    SELECT ANY v WITHIN tree SATISFIES v = 5 END AS found
  sql: |-
    jsonb_path_exists(col, '$..* ? (@ == 5)')
  duckdb: |-
    —
  js: |-
    [...walk(tree)].includes(5)
  python: |-
    any(v == 5 for v in walk(tree))
  mongo: |-
    —
  jq: |-
    [.. | select(. == 5)] | length > 0

- section: '8. Recursion & deep search'
  title: 'Find every object with a given id, at any depth'
  data: |-
    tree = {"a": {"id": "x"}, "b": [{"id": "y"}]}
  bind: |-
    tree AS ({"a":{"id":"x"},"b":[{"id":"y"}]})
  out: |-
    {"hits":[{"id":"y"}]}
  sqlpp: |-
    SELECT ARRAY v FOR v WITHIN tree WHEN v.id = "y" END AS hits
  sql: |-
    jsonb_path_query(col, '$..* ? (@.id == "y")')
  duckdb: |-
    —
  js: |-
    [...walk(tree)].filter(v => v && v.id === "y")
  python: |-
    [v for v in walk(tree) if isinstance(v, dict) and v.get("id") == "y"]
  mongo: |-
    —
  jq: |-
    [.. | objects | select(.id == "y")]

# ============================================================ 9. reshaping
- section: '9. Reshaping records'
  title: 'UNNEST — explode a nested array into rows'
  note: |-
    The workhorse for line-items, tags, events. SQL++ UNNEST pairs each element with its
    parent's fields.
  data: |-
    docs = [{"id": 1, "tags": ["a", "b"]}]
  bind: |-
    docs AS ([{"id":1,"tags":["a","b"]}])
  out: |-
    {"id":1,"tag":"a"} then {"id":1,"tag":"b"}
  sqlpp: |-
    SELECT o.id, t AS tag
    FROM docs AS o
    UNNEST o.tags AS t
  sql: |-
    … , jsonb_array_elements_text(o->'tags') t   -- lateral cross join
  duckdb: |-
    SELECT id, unnest(tags) AS tag FROM docs
  js: |-
    docs.flatMap(o => o.tags.map(t => ({id: o.id, tag: t})))
  python: |-
    [{"id": o["id"], "tag": t} for o in docs for t in o["tags"]]
  mongo: |-
    [{$unwind: "$tags"}, {$project: {id: 1, tag: "$tags"}}]
  jq: |-
    .[] | {id, tag: .tags[]}

- section: '9. Reshaping records'
  title: 'Reshape + rename + sort'
  data: |-
    dms = [{"text": "hi", "sender": {"screen_name": "amy"}, "ts": 2},
           {"text": "yo", "sender": {"screen_name": "bo"},  "ts": 1}]
  bind: |-
    dms AS ([{"text":"hi","sender":{"screen_name":"amy"},"ts":2},{"text":"yo","sender":{"screen_name":"bo"},"ts":1}])
  out: |-
    {"text":"yo","from_name":"bo"} then {"text":"hi","from_name":"amy"}
  sqlpp: |-
    SELECT d.text, d.sender.screen_name AS from_name
    FROM dms AS d
    ORDER BY d.ts
  sql: |-
    SELECT col->>'text', col#>>'{sender,screen_name}' FROM dms ORDER BY col->>'ts'
  duckdb: |-
    SELECT text, sender.screen_name AS from_name FROM dms ORDER BY ts
  js: |-
    dms.map(d => ({text: d.text, from: d.sender.screen_name})).sort((a,b)=>a.ts-b.ts)
  python: |-
    sorted(({"text": d["text"], "from": d["sender"]["screen_name"]} for d in dms), key=…)
  mongo: |-
    [{$project: {text: 1, from: "$sender.screen_name"}}, {$sort: {ts: 1}}]
  jq: |-
    [.[] | {text, from: .sender.screen_name}] | sort_by(.ts)

- section: '9. Reshaping records'
  title: 'Merge two arrays, flagging one'
  data: |-
    doc = {"team": [{"n": "a"}], "formerly": [{"n": "b"}]}
  bind: |-
    doc AS ({"team":[{"n":"a"}],"formerly":[{"n":"b"}]})
  out: |-
    {"everyone":[{"n":"a"},{"formerly":true,"n":"b"}]}
  sqlpp: |-
    SELECT ARRAY_CONCAT(doc.team,
           ARRAY OBJECT_ADD(m, "formerly", true) FOR m IN doc.formerly END) AS everyone
  sql: |-
    (col->'team') || (SELECT jsonb_agg(m || '{"formerly":true}') FROM jsonb_array_elements(col->'formerly') m)
  duckdb: |-
    list_concat(team, [struct_insert(m, formerly := true) for m in formerly])
  js: |-
    [...doc.team, ...doc.formerly.map(m => ({...m, formerly: true}))]
  python: |-
    doc["team"] + [{**m, "formerly": True} for m in doc["formerly"]]
  mongo: |-
    {$concatArrays: ["$team", {$map: {input: "$formerly", in: {$mergeObjects: ["$$this", {formerly: true}]}}}]}
  jq: |-
    [.team, (.formerly | map(. + {formerly: true}))] | flatten

# ============================================================ 10. conditionals
- section: '10. Conditionals & defaults'
  title: 'if / then / else'
  out: |-
    {"c":"big"}
  sqlpp: |-
    SELECT CASE WHEN 5 > 3 THEN "big" ELSE "small" END AS c
  sql: |-
    CASE WHEN 5 > 3 THEN 'big' ELSE 'small' END
  duckdb: |-
    if(5 > 3, 'big', 'small')
  js: |-
    5 > 3 ? "big" : "small"
  python: |-
    "big" if 5 > 3 else "small"
  mongo: |-
    {$cond: [{$gt: [5, 3]}, "big", "small"]}
  jq: |-
    if . > 3 then "big" else "small" end

- section: '10. Conditionals & defaults'
  title: 'Default for a missing/null value'
  note: |-
    SQL++ splits what COALESCE and jq's // blur: IFMISSING / IFNULL / IFMISSINGORNULL treat
    absent and present-but-null differently.
  data: |-
    doc = {}
  bind: |-
    doc AS ({})
  out: |-
    {"v":"default"}
  sqlpp: |-
    SELECT IFMISSINGORNULL(doc.foo, "default") AS v
  sql: |-
    COALESCE(col->>'foo', 'default')
  duckdb: |-
    COALESCE(doc.foo, 'default')
  js: |-
    doc.foo ?? "default"
  python: |-
    doc.get("foo", "default")
  mongo: |-
    {$ifNull: ["$foo", "default"]}
  jq: |-
    .foo // "default"

- section: '10. Conditionals & defaults'
  title: "Type guard (jq's try/catch)"
  note: |-
    jq guards type errors with try/catch; SQL++ has no type errors — a bad op yields
    NULL/MISSING — so guard with CASE.
  data: |-
    vals = [{"a": 1}, "str"]
  bind: |-
    vals AS ([{"a":1},"str"])
  out: |-
    {"a":1} then {}   (the string has no .a → MISSING)
  sqlpp: |-
    SELECT CASE WHEN TYPE(x) = "object" THEN x.a END AS a
    FROM vals AS x
  sql: |-
    —
  duckdb: |-
    —
  js: |-
    try { x.a } catch { null }
  python: |-
    x.get("a") if isinstance(x, dict) else None
  mongo: |-
    {$cond: [{$eq: [{$type: "$x"}, "object"]}, "$x.a", null]}
  jq: |-
    try .a catch null
