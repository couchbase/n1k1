# SQL++ recipes — DATA source of truth (a YAML sequence of recipe records).
# n1k1 itself can query this:  n1k1 -c 'SELECT title, sqlpp FROM recipes' docs/recipes.yaml
# Rendered to recipes.md / recipes.html by docs/recipes_build.py; run it after editing.
# `python3 docs/recipes_build.py --check` runs every sqlpp against ./n1k1.
#
# Fields: section, title, note?, needs?(=shop), data?/bind?, out?, and one per dialect
# (sqlpp, sql, duckdb, js, python, mongo, jq). Source data is shown ONCE per recipe
# (data/bind) so every dialect just references a shared name — a fair comparison. For
# self-contained recipes, `bind` is the SQL++ `WITH <bind>` that binds that data.

# ============================================================ 1. collection
- section: '1. Querying a collection'
  section_color: '#4f46e5'
  title: 'Pick fields from each record'
  needs: 'shop'
  data: |-
    orders — the shop keyspace (20 docs), e.g.
    {"id":"1005","customer":"dave","total":22.0,"status":"shipped","ts":"2026-01-06"}
  out: |-
    {"id":"1005","status":"shipped","total":22.0}, … (one per order)
  sqlpp: |-
    SELECT id, status, total
    FROM orders
  sql: |-
    SELECT id, status, total
    FROM orders
  duckdb: |-
    SELECT id, status, total
    FROM orders
  js: |-
    orders.map(o => ({id: o.id, status: o.status, total: o.total}))
  python: |-
    [{"id": o["id"], "status": o["status"], "total": o["total"]} for o in orders]
  mongo: |-
    db.orders.find({}, {id: 1, status: 1, total: 1, _id: 0})
  jq: |-
    .[] | {id, status, total}

- section: '1. Querying a collection'
  section_color: '#4f46e5'
  title: 'Keep matching records'
  needs: 'shop'
  data: |-
    orders — the shop keyspace (20 docs), e.g.
    {"id":"1005","customer":"dave","total":22.0,"status":"shipped","ts":"2026-01-06"}
  out: |-
    the orders with total over 100
  sqlpp: |-
    SELECT id, total
    FROM orders
    WHERE total > 100
  sql: |-
    SELECT id, total
    FROM orders
    WHERE total > 100
  duckdb: |-
    SELECT id, total
    FROM orders
    WHERE total > 100
  js: |-
    orders.filter(o => o.total > 100)
  python: |-
    [o for o in orders if o["total"] > 100]
  mongo: |-
    db.orders.find({total: {$gt: 100}})
  jq: |-
    map(select(.total > 100))

- section: '1. Querying a collection'
  section_color: '#4f46e5'
  title: 'Sort, then take the top N'
  needs: 'shop'
  data: |-
    orders — the shop keyspace (20 docs), e.g.
    {"id":"1005","customer":"dave","total":22.0,"status":"shipped","ts":"2026-01-06"}
  out: |-
    {"id":"1020","total":389.99}, {"id":"1019","total":245.0}, {"id":"1003","total":210.00}
  sqlpp: |-
    SELECT id, total
    FROM orders
    ORDER BY total DESC
    LIMIT 3
  sql: |-
    SELECT id, total
    FROM orders
    ORDER BY total DESC
    LIMIT 3
  duckdb: |-
    SELECT id, total
    FROM orders
    ORDER BY total DESC
    LIMIT 3
  js: |-
    orders.toSorted((a, b) => b.total - a.total).slice(0, 3)
  python: |-
    sorted(orders, key=lambda o: -o["total"])[:3]
  mongo: |-
    db.orders.find().sort({total: -1}).limit(3)
  jq: |-
    sort_by(.total) | reverse | .[:3]

- section: '1. Querying a collection'
  section_color: '#4f46e5'
  title: 'The single largest record'
  note: |-
    jq's max_by returns the whole record with the largest key; in SQL it's ORDER BY … LIMIT 1.
  needs: 'shop'
  data: |-
    orders — the shop keyspace (20 docs), e.g.
    {"id":"1005","customer":"dave","total":22.0,"status":"shipped","ts":"2026-01-06"}
  out: |-
    the priciest order (the whole row)
  sqlpp: |-
    SELECT orders.*
    FROM orders
    ORDER BY total DESC
    LIMIT 1
  sql: |-
    SELECT *
    FROM orders
    ORDER BY total DESC
    LIMIT 1
  duckdb: |-
    SELECT MAX_BY(orders, total)
    FROM orders
  js: |-
    orders.reduce((m, o) => o.total > m.total ? o : m)
  python: |-
    max(orders, key=lambda o: o["total"])
  mongo: |-
    db.orders.find().sort({total: -1}).limit(1)
  jq: |-
    max_by(.total)

- section: '1. Querying a collection'
  section_color: '#4f46e5'
  title: 'Count and total a collection'
  needs: 'shop'
  data: |-
    orders — the shop keyspace (20 docs), e.g.
    {"id":"1005","customer":"dave","total":22.0,"status":"shipped","ts":"2026-01-06"}
  out: |-
    {"n":20,"revenue":1949.36,"avg":97.47}
  sqlpp: |-
    SELECT COUNT(*)             AS n,
           ROUND(SUM(total), 2) AS revenue,
           ROUND(AVG(total), 2) AS avg
    FROM orders
  sql: |-
    SELECT COUNT(*)             AS n,
           ROUND(SUM(total), 2) AS revenue,
           ROUND(AVG(total), 2) AS avg
    FROM orders
  duckdb: |-
    SELECT COUNT(*)             AS n,
           ROUND(SUM(total), 2) AS revenue,
           ROUND(AVG(total), 2) AS avg
    FROM orders
  js: |-
    ({n: orders.length, revenue: orders.reduce((s, o) => s + o.total, 0)})
  python: |-
    {"n": len(orders), "revenue": sum(o["total"] for o in orders)}
  mongo: |-
    db.orders.aggregate([{$group: {_id: null, n: {$sum: 1}, revenue: {$sum: "$total"}, avg: {$avg: "$total"}}}])
  jq: |-
    {n: length, revenue: (map(.total) | add)}

- section: '1. Querying a collection'
  section_color: '#4f46e5'
  title: 'Group, then aggregate each group'
  needs: 'shop'
  data: |-
    orders — the shop keyspace (20 docs), e.g.
    {"id":"1005","customer":"dave","total":22.0,"status":"shipped","ts":"2026-01-06"}
  out: |-
    {"status":"shipped","n":16,"revenue":1758.73}, {"status":"pending",…}, {"status":"cancelled",…}
  sqlpp: |-
    SELECT status,
           COUNT(*) AS n,
           ROUND(SUM(total), 2) AS revenue
    FROM orders
    GROUP BY status
    ORDER BY revenue DESC
  sql: |-
    SELECT status,
           COUNT(*) AS n,
           ROUND(SUM(total),2) AS revenue
    FROM orders
    GROUP BY status
    ORDER BY revenue DESC
  duckdb: |-
    SELECT status,
           COUNT(*) AS n,
           ROUND(SUM(total),2) AS revenue
    FROM orders
    GROUP BY status
    ORDER BY revenue DESC
  js: |-
    Object.groupBy(orders, o => o.status)   // then reduce each bucket
  python: |-
    df.groupby("status").total.agg(["count", "sum"])   # pandas
  mongo: |-
    db.orders.aggregate([
      {$group: {_id: "$status", n: {$sum: 1}, revenue: {$sum: "$total"}}},
      {$sort: {revenue: -1}}])
  jq: |-
    group_by(.status)   # → array of arrays

- section: '1. Querying a collection'
  section_color: '#4f46e5'
  title: 'RAW — one bare value per row (not an object)'
  note: |-
    A normal SELECT yields objects; SELECT RAW (jq's .[] | .field) yields the bare value —
    handy for one column, an IN-list, or feeding another query.
  needs: 'shop'
  data: |-
    orders — the shop keyspace (20 docs), e.g.
    {"id":"1005","customer":"dave","total":22.0,"status":"shipped","ts":"2026-01-06"}
  out: |-
    "dave", "alice", …  (bare strings, not {"customer":…})
  sqlpp: |-
    SELECT RAW customer
    FROM orders
  sql: |-
    —
  duckdb: |-
    —
  js: |-
    orders.map(o => o.customer)
  python: |-
    [o["customer"] for o in orders]
  mongo: |-
    db.orders.distinct("customer")  // bare values (also dedups)
  jq: |-
    .[] | .customer

# ============================================================ 2. reach in
- section: '2. Reaching into a value'
  section_color: '#0d9488'
  title: 'Field access, including nested'
  data: |-
    doc = {"id": "o1", "customer": {"name": "Dave", "city": "Austin"}}
  bind: |-
    doc AS ({"id":"o1","customer":{"name":"Dave","city":"Austin"}})
  out: |-
    {"city":"Austin"}
  sqlpp: |-
    SELECT doc.customer.city
    FROM doc
  sql: |-
    SELECT doc->'customer'->>'city'
    FROM doc
    -- ->> text, -> jsonb
  duckdb: |-
    SELECT doc->'$.customer.city'
    FROM doc
  js: |-
    doc.customer.city
  python: |-
    doc["customer"]["city"]
  mongo: |-
    db.c.find({}, {"customer.city": 1})
  jq: |-
    .customer.city

- section: '2. Reaching into a value'
  section_color: '#0d9488'
  title: 'A missing field is MISSING (not an error)'
  note: |-
    jq's ? suppresses errors on non-objects; SQL++ has no error — a missing path is MISSING
    and simply drops out of the result (see "MISSING vs NULL" at the end).
  data: |-
    doc = {"bar": 1}
  bind: |-
    doc AS ({"bar":1})
  out: |-
    {}   (foo is MISSING → the key is omitted)
  sqlpp: |-
    SELECT doc.foo
    FROM doc
  sql: |-
    SELECT doc->'foo' -- NULL if absent
    FROM doc
  duckdb: |-
    SELECT doc->'$.foo'
    FROM doc
  js: |-
    doc.foo               // undefined
  python: |-
    doc.get("foo")        # None
  mongo: |-
    // a missing field is simply absent from the result
  jq: |-
    .foo?                 # no error even on a non-object

- section: '2. Reaching into a value'
  section_color: '#0d9488'
  title: 'Array index — 0-based, negatives from the end'
  data: |-
    doc = {"nums": [10, 20, 30]}
  bind: |-
    doc AS ({"nums":[10,20,30]})
  out: |-
    {"first":10,"last":30,"penult":20}
  sqlpp: |-
    SELECT doc.nums[0]  AS `first`,
           doc.nums[-1] AS `last`,
           doc.nums[-2] AS penult
    FROM doc
  sql: |-
    SELECT doc->'nums'->0  AS "first",
           doc->'nums'->-1 AS "last",
           doc->'nums'->-2 AS penult
    FROM doc
    -- jsonb: 0-based, -1 = last
  duckdb: |-
    SELECT doc.nums[1]  AS first,
           doc.nums[-1] AS last,
           doc.nums[-2] AS penult
    FROM doc
    -- ⚠ 1-based
  js: |-
    doc.nums[0]; doc.nums.at(-1); doc.nums.at(-2)
  python: |-
    doc["nums"][0]; doc["nums"][-1]; doc["nums"][-2]
  mongo: |-
    {first: {$arrayElemAt: ["$nums", 0]}, last: {$arrayElemAt: ["$nums", -1]}, penult: {$arrayElemAt: ["$nums", -2]}}
  jq: |-
    .nums[0], .nums[-1], .nums[-2]
- section: '2. Reaching into a value'
  section_color: '#0d9488'
  title: 'Slice a range'
  data: |-
    doc = {"letters": ["a", "b", "c", "d", "e"]}
  bind: |-
    doc AS ({"letters":["a","b","c","d","e"]})
  out: |-
    {"s":["c","d"]}
  sqlpp: |-
    SELECT doc.letters[2:4] AS s
    FROM doc
  sql: |-
    SELECT JSONB_PATH_QUERY_ARRAY(doc->'letters', '$[2 to 3]') AS s
    FROM doc
  duckdb: |-
    SELECT doc.letters[3:4] AS s
    FROM doc
    -- ⚠ 1-based, inclusive
  js: |-
    doc.letters.slice(2, 4)
  python: |-
    doc["letters"][2:4]
  mongo: |-
    {$slice: ["$letters", 2, 2]}
  jq: |-
    .letters[2:4]
# ============================================================ 3. arrays
- section: '3. Transforming arrays'
  section_color: '#d97706'
  title: 'Map — transform every element'
  note: |-
    SQL++ has two forms: a scan (SELECT … FROM nums) or the inline array comprehension
    ARRAY … FOR … END that returns one array value.
  data: |-
    doc = {"nums": [1, 2, 3]}
  bind: |-
    doc AS ({"nums":[1,2,3]})
  out: |-
    {"r":[2,3,4]}
  sqlpp: |-
    SELECT ARRAY v + 1 FOR v IN doc.nums END AS r
    FROM doc
  sql: |-
    SELECT JSONB_AGG(v::int + 1) AS r
    FROM doc, JSONB_ARRAY_ELEMENTS(doc->'nums') AS v
  duckdb: |-
    SELECT [x + 1 for x in doc.nums] AS r
    FROM doc
  js: |-
    doc.nums.map(x => x + 1)
  python: |-
    [x + 1 for x in doc["nums"]]
  mongo: |-
    {$map: {input: "$nums", as: "v", in: {$add: ["$$v", 1]}}}
  jq: |-
    .nums | map(. + 1)
- section: '3. Transforming arrays'
  section_color: '#d97706'
  title: 'Filter — keep matching elements'
  data: |-
    doc = {"nums": [1, 5, 3, 0, 7]}
  bind: |-
    doc AS ({"nums":[1,5,3,0,7]})
  out: |-
    {"r":[5,3,7]}
  sqlpp: |-
    SELECT ARRAY v
             FOR v IN doc.nums
             WHEN v >= 2
             END AS r
    FROM doc
  sql: |-
    SELECT JSONB_AGG(v) AS r
    FROM doc, JSONB_ARRAY_ELEMENTS(doc->'nums') AS v
    WHERE v::int >= 2
  duckdb: |-
    SELECT [x for x in doc.nums if x >= 2] AS r
    FROM doc
  js: |-
    doc.nums.filter(x => x >= 2)
  python: |-
    [x for x in doc["nums"] if x >= 2]
  mongo: |-
    {$filter: {input: "$nums", cond: {$gte: ["$$this", 2]}}}
  jq: |-
    .nums | map(select(. >= 2))
- section: '3. Transforming arrays'
  section_color: '#d97706'
  title: 'Sum, min, max, average'
  data: |-
    doc = {"nums": [1, 2, 3]}
  bind: |-
    doc AS ({"nums":[1,2,3]})
  out: |-
    {"s":6,"mx":3,"a":2}
  sqlpp: |-
    SELECT ARRAY_SUM(doc.nums) AS s,
           ARRAY_MAX(doc.nums) AS mx,
           ARRAY_AVG(doc.nums) AS a
    FROM doc
  sql: |-
    SELECT SUM(v::int) AS s,
           MAX(v::int) AS mx,
           AVG(v::int) AS a
    FROM doc, JSONB_ARRAY_ELEMENTS(doc->'nums') AS v
  duckdb: |-
    SELECT LIST_SUM(doc.nums) AS s,
           LIST_MAX(doc.nums) AS mx,
           LIST_AVG(doc.nums) AS a
    FROM doc
  js: |-
    doc.nums.reduce((a, b) => a + b, 0); Math.max(...doc.nums)
  python: |-
    sum(doc["nums"]); max(doc["nums"]); statistics.mean(doc["nums"])
  mongo: |-
    {$sum: "$nums"}; {$max: "$nums"}; {$avg: "$nums"}
  jq: |-
    .nums | add; .nums | max; (.nums | add / length)
- section: '3. Transforming arrays'
  section_color: '#d97706'
  title: 'Length / count of elements'
  data: |-
    doc = {"nums": [1, 2, 3]}
  bind: |-
    doc AS ({"nums":[1,2,3]})
  out: |-
    {"n":3}
  sqlpp: |-
    SELECT ARRAY_LENGTH(doc.nums) AS n
    FROM doc
  sql: |-
    SELECT JSONB_ARRAY_LENGTH(doc->'nums') AS n
    FROM doc
  duckdb: |-
    SELECT LEN(doc.nums) AS n
    FROM doc
  js: |-
    doc.nums.length
  python: |-
    len(doc["nums"])
  mongo: |-
    {$size: "$nums"}
  jq: |-
    .nums | length
- section: '3. Transforming arrays'
  section_color: '#d97706'
  title: 'Unique / dedup'
  note: |-
    ARRAY_DISTINCT keeps first-seen order; wrap in ARRAY_SORT for jq's sorted result.
  data: |-
    doc = {"nums": [1, 2, 5, 3, 5, 3, 1]}
  bind: |-
    doc AS ({"nums":[1,2,5,3,5,3,1]})
  out: |-
    {"u":[1,2,5,3]}
  sqlpp: |-
    SELECT ARRAY_DISTINCT(doc.nums) AS u
    FROM doc
  sql: |-
    SELECT JSONB_AGG(DISTINCT v) AS u
    FROM doc, JSONB_ARRAY_ELEMENTS(doc->'nums') AS v
  duckdb: |-
    SELECT LIST_DISTINCT(doc.nums) AS u
    FROM doc
  js: |-
    [...new Set(doc.nums)]
  python: |-
    list(dict.fromkeys(doc["nums"]))
  mongo: |-
    {$setUnion: ["$nums", []]}   // unordered
  jq: |-
    .nums | unique   # sorted
- section: '3. Transforming arrays'
  section_color: '#d97706'
  title: 'Flatten nested arrays'
  note: |-
    ⚠ SQL++ ARRAY_FLATTEN needs an explicit depth; jq flattens fully.
  data: |-
    doc = {"nested": [1, [2], [[3]]]}
  bind: |-
    doc AS ({"nested":[1,[2],[[3]]]})
  out: |-
    {"f":[1,2,3]}
  sqlpp: |-
    SELECT ARRAY_FLATTEN(doc.nested, 2) AS f
    FROM doc
  sql: |-
    -- recursive unnest; no single builtin
  duckdb: |-
    SELECT FLATTEN(doc.nested) AS f
    FROM doc
    -- one level
  js: |-
    doc.nested.flat(2)
  python: |-
    # no deep builtin; recurse
  mongo: |-
    {$reduce: {input: "$nested", initialValue: [], in: {$concatArrays: ["$$value", "$$this"]}}}  // one level
  jq: |-
    .nested | flatten
- section: '3. Transforming arrays'
  section_color: '#d97706'
  title: 'Reverse · range · append · concat'
  out: |-
    {"rev":[3,2,1],"rng":[2,3],"app":[1,2,3],"cat":[1,2]}
  sqlpp: |-
    SELECT ARRAY_REVERSE([1,2,3]) AS rev,
           ARRAY_RANGE(2, 4)      AS rng,
           ARRAY_APPEND([1,2], 3) AS app,
           ARRAY_CONCAT([1], [2]) AS cat
  sql: |-
    SELECT ARRAY_APPEND(ARRAY[1,2], 3) AS rng,
           ARRAY[1] || ARRAY[2]        AS app,
           GENERATE_SERIES(2, 3)       AS cat
           -- (no array reverse builtin)
  duckdb: |-
    SELECT LIST_REVERSE(a)  AS rev,
           RANGE(2,4)       AS rng,
           LIST_APPEND(a,x) AS app,
           LIST_CONCAT(a,b) AS cat
  js: |-
    a.toReversed(); [...Array(2).keys()].map(i=>i+2); [...a, x]; a.concat(b)
  python: |-
    a[::-1]; list(range(2,4)); a + [x]; a + b
  mongo: |-
    {$reverseArray}; {$range:[2,4]}; {$concatArrays}
  jq: |-
    reverse; [range(2;4)]; . + [x]; .a + .b

- section: '3. Transforming arrays'
  section_color: '#d97706'
  title: 'Every other element'
  note: |-
    Index by a stepped range (OBJECT_PAIRS works on objects only, not arrays).
  data: |-
    doc = {"letters": ["a", "b", "c", "d"]}
  bind: |-
    doc AS ({"letters":["a","b","c","d"]})
  out: |-
    {"evens":["a","c"]}
  sqlpp: |-
    SELECT ARRAY doc.letters[i]
           FOR i IN ARRAY_RANGE(0, ARRAY_LENGTH(doc.letters), 2)
               END AS evens
    FROM doc
  sql: |-
    SELECT JSONB_AGG(v) AS evens
    FROM doc,
         JSONB_ARRAY_ELEMENTS(doc->'letters') WITH ORDINALITY t(v, i)
    WHERE i % 2 = 1
  duckdb: |-
    SELECT LIST_SLICE(doc.letters, 1, 4, 2) AS evens
    FROM doc
    -- 1-based, step 2
  js: |-
    doc.letters.filter((_, i) => i % 2 === 0)
  python: |-
    doc["letters"][::2]
  mongo: |-
    {$map: {input: {$range: [0, {$size: "$letters"}, 2]}, in: {$arrayElemAt: ["$letters", "$$this"]}}}
  jq: |-
    .letters | [range(0; length; 2) as $i | .[$i]]
- section: '3. Transforming arrays'
  section_color: '#d97706'
  title: 'Chunk into fixed-size groups'
  note: |-
    ⚠ Clamp the slice end with LEAST(…, ARRAY_LENGTH(a)) — a slice past the end is MISSING
    and would drop the last short chunk.
  data: |-
    doc = {"nums": [1, 2, 3, 4, 5]}
  bind: |-
    doc AS ({"nums":[1,2,3,4,5]})
  out: |-
    {"chunks":[[1,2],[3,4],[5]]}
  sqlpp: |-
    SELECT ARRAY doc.nums[i:LEAST(i + 2, ARRAY_LENGTH(doc.nums))]
           FOR i IN ARRAY_RANGE(0, ARRAY_LENGTH(doc.nums), 2)
               END AS chunks
    FROM doc
  sql: |-
    -- window / ntile, or generate_series with slicing
  duckdb: |-
    SELECT [doc.nums[i+1 : i+2] for i in RANGE(0, LEN(doc.nums), 2)] AS chunks
    FROM doc
  js: |-
    Array.from({length: Math.ceil(doc.nums.length/2)}, (_, i) => doc.nums.slice(i*2, i*2+2))
  python: |-
    [doc["nums"][i:i+2] for i in range(0, len(doc["nums"]), 2)]
  mongo: |-
    —
  jq: |-
    .nums | [range(0; length; 2) as $i | .[$i:$i+2]]
# ============================================================ 4. iterate/collect
- section: '4. Iterating & collecting'
  section_color: '#0284c7'
  title: 'Visit each element'
  data: |-
    doc = {"people": [{"name": "JSON"}, {"name": "XML"}]}
  bind: |-
    doc AS ({"people":[{"name":"JSON"},{"name":"XML"}]})
  out: |-
    {"name":"JSON"} then {"name":"XML"}
  sqlpp: |-
    SELECT p.*
    FROM doc
    UNNEST doc.people AS p
  sql: |-
    SELECT p
    FROM doc, JSONB_ARRAY_ELEMENTS(doc->'people') AS p
  duckdb: |-
    SELECT UNNEST(doc.people)
    FROM doc
  js: |-
    for (const p of doc.people) { … }
  python: |-
    for p in doc["people"]: ...
  mongo: |-
    db.people.find()
  jq: |-
    .people[]
- section: '4. Iterating & collecting'
  section_color: '#0284c7'
  title: 'One field from each element'
  data: |-
    doc = {"people": [{"name": "JSON"}, {"name": "XML"}]}
  bind: |-
    doc AS ({"people":[{"name":"JSON"},{"name":"XML"}]})
  out: |-
    "JSON", "XML"
  sqlpp: |-
    SELECT RAW p.name
    FROM doc
    UNNEST doc.people AS p
  sql: |-
    SELECT p->>'name'
    FROM doc, JSONB_ARRAY_ELEMENTS(doc->'people') AS p
  duckdb: |-
    SELECT p.name
    FROM doc, UNNEST(doc.people) AS t(p)
  js: |-
    doc.people.map(p => p.name)
  python: |-
    [p["name"] for p in doc["people"]]
  mongo: |-
    db.people.find({}, {name: 1, _id: 0})
  jq: |-
    .people[] | .name
- section: '4. Iterating & collecting'
  section_color: '#0284c7'
  title: 'Collect values into one array'
  data: |-
    doc = {"user": "s", "projects": ["jq", "wf"]}
  bind: |-
    doc AS ({"user":"s","projects":["jq","wf"]})
  out: |-
    {"r":["s","jq","wf"]}
  sqlpp: |-
    SELECT ARRAY_PREPEND(doc.user, doc.projects) AS r
    FROM doc
  sql: |-
    SELECT doc->'user' || doc->'projects' AS r
    FROM doc
  duckdb: |-
    SELECT LIST_PREPEND(doc.user, doc.projects) AS r
    FROM doc
  js: |-
    [doc.user, ...doc.projects]
  python: |-
    [doc["user"], *doc["projects"]]
  mongo: |-
    {$concatArrays: [["$user"], "$projects"]}
  jq: |-
    [.user, .projects[]]

# ============================================================ 5. objects
- section: '5. Building & reshaping objects'
  section_color: '#7c3aed'
  title: 'Build an object'
  note: |-
    Keys inside a constructed object render sorted (canonical JSON): title before user.
  data: |-
    doc = {"user": "s", "title": "JQ"}
  bind: |-
    doc AS ({"user":"s","title":"JQ"})
  out: |-
    {"o":{"title":"JQ","user":"s"}}
  sqlpp: |-
    SELECT {"user": doc.user, "title": doc.title} AS o
    FROM doc
  sql: |-
    SELECT JSONB_BUILD_OBJECT('user', doc->'user', 'title', doc->'title') AS o
    FROM doc
  duckdb: |-
    SELECT {'user': doc.user, 'title': doc.title} AS o
    FROM doc
  js: |-
    ({user: doc.user, title: doc.title})
  python: |-
    {"user": doc["user"], "title": doc["title"]}
  mongo: |-
    {$project: {user: 1, title: 1, _id: 0}}
  jq: |-
    {user, title}

- section: '5. Building & reshaping objects'
  section_color: '#7c3aed'
  title: "List an object's keys"
  data: |-
    doc = {"obj": {"b": 2, "a": 1}}
  bind: |-
    doc AS ({"obj":{"b":2,"a":1}})
  out: |-
    {"k":["a","b"]}
  sqlpp: |-
    SELECT OBJECT_NAMES(doc.obj) AS k
    FROM doc
  sql: |-
    SELECT JSONB_OBJECT_KEYS(doc->'obj') AS k
    FROM doc
  duckdb: |-
    SELECT JSON_KEYS(doc.obj) AS k
    FROM doc
  js: |-
    Object.keys(doc.obj)
  python: |-
    list(doc["obj"].keys())
  mongo: |-
    {$map: {input: {$objectToArray: "$obj"}, in: "$$this.k"}}
  jq: |-
    .obj | keys   # sorted
- section: '5. Building & reshaping objects'
  section_color: '#7c3aed'
  title: 'Object → array of pairs'
  note: |-
    ⚠ SQL++ OBJECT_PAIRS yields {name, val}; jq yields {key, value}.
  data: |-
    doc = {"obj": {"a": 1, "b": 2}}
  bind: |-
    doc AS ({"obj":{"a":1,"b":2}})
  out: |-
    {"p":[{"name":"a","val":1},{"name":"b","val":2}]}
  sqlpp: |-
    SELECT OBJECT_PAIRS(doc.obj) AS p
    FROM doc
  sql: |-
    SELECT JSONB_EACH(doc->'obj') AS p
    FROM doc
  duckdb: |-
    SELECT MAP_ENTRIES(doc.obj) AS p
    FROM doc
  js: |-
    Object.entries(doc.obj)   // [["a",1],["b",2]]
  python: |-
    list(doc["obj"].items())
  mongo: |-
    {$objectToArray: "$obj"}   // [{k,v}]
  jq: |-
    .obj | to_entries   # [{key,value}]
- section: '5. Building & reshaping objects'
  section_color: '#7c3aed'
  title: 'Pairs → object'
  data: |-
    doc = {"pairs": [{"name": "a", "val": 1}]}
  bind: |-
    doc AS ({"pairs":[{"name":"a","val":1}]})
  out: |-
    {"o":{"a":1}}
  sqlpp: |-
    SELECT OBJECT p.name : p.val
             FOR p IN doc.pairs END AS o
    FROM doc
  sql: |-
    SELECT JSONB_OBJECT_AGG(p->>'name', p->'val') AS o
    FROM doc, JSONB_ARRAY_ELEMENTS(doc->'pairs') AS p
  duckdb: |-
    SELECT MAP_FROM_ENTRIES(doc.pairs) AS o
    FROM doc
  js: |-
    Object.fromEntries(doc.pairs.map(p => [p.name, p.val]))
  python: |-
    {p["name"]: p["val"] for p in doc["pairs"]}
  mongo: |-
    {$arrayToObject: "$pairs"}
  jq: |-
    .pairs | from_entries
- section: '5. Building & reshaping objects'
  section_color: '#7c3aed'
  title: 'Object with a key from the data'
  note: |-
    ⚠ Keys must be strings; `value` is a reserved word (back-quoted).
  data: |-
    doc = {"recs": [{"label": "a", "value": 1}]}
  bind: |-
    doc AS ({"recs":[{"label":"a","value":1}]})
  out: |-
    {"o":{"a":1}}
  sqlpp: |-
    SELECT OBJECT r.label : r.`value` FOR r IN doc.recs END AS o
    FROM doc
  sql: |-
    SELECT JSONB_OBJECT_AGG(r->>'label', r->'value') AS o
    FROM doc, JSONB_ARRAY_ELEMENTS(doc->'recs') AS r
  duckdb: |-
    SELECT MAP_FROM_ENTRIES([{'k': r.label, 'v': r.value} for r in doc.recs]) AS o
    FROM doc
  js: |-
    Object.fromEntries(doc.recs.map(r => [r.label, r.value]))
  python: |-
    {r["label"]: r["value"] for r in doc["recs"]}
  mongo: |-
    {$arrayToObject: {$map: {input: "$recs", in: {k: "$$this.label", v: "$$this.value"}}}}
  jq: |-
    .recs | map({(.label): .value}) | add
- section: '5. Building & reshaping objects'
  section_color: '#7c3aed'
  title: 'Transform every value, keep keys'
  data: |-
    doc = {"obj": {"a": 1, "b": 2}}
  bind: |-
    doc AS ({"obj":{"a":1,"b":2}})
  out: |-
    {"o":{"a":2,"b":3}}
  sqlpp: |-
    SELECT OBJECT p.name : p.val + 1
             FOR p IN OBJECT_PAIRS(doc.obj) END AS o
    FROM doc
  sql: |-
    SELECT JSONB_OBJECT_AGG(k, (v::int)+1) AS o
    FROM doc, JSONB_EACH(doc->'obj') AS e(k, v)
  duckdb: |-
    SELECT MAP_FROM_ENTRIES([{'k': e.key, 'v': e.value + 1}
                             for e in MAP_ENTRIES(doc.obj)]) AS o
    FROM doc
  js: |-
    Object.fromEntries(Object.entries(doc.obj).map(([k, v]) => [k, v + 1]))
  python: |-
    {k: v + 1 for k, v in doc["obj"].items()}
  mongo: |-
    {$arrayToObject: {$map: {input: {$objectToArray: "$obj"}, in: {k: "$$this.k", v: {$add: ["$$this.v", 1]}}}}}
  jq: |-
    .obj | map_values(. + 1)
- section: '5. Building & reshaping objects'
  section_color: '#7c3aed'
  title: 'Swap keys and values'
  data: |-
    doc = {"obj": {"a": 1, "b": 2}}
  bind: |-
    doc AS ({"obj":{"a":1,"b":2}})
  out: |-
    {"o":{"1":"a","2":"b"}}
  sqlpp: |-
    SELECT OBJECT TO_STRING(p.val) : p.name
             FOR p IN OBJECT_PAIRS(doc.obj) END AS o
    FROM doc
  sql: |-
    SELECT JSONB_OBJECT_AGG(v#>>'{}', k) AS o
    FROM doc, JSONB_EACH(doc->'obj') AS e(k, v)
  duckdb: |-
    SELECT MAP_FROM_ENTRIES([{'k': e.value::VARCHAR, 'v': e.key}
                             for e in MAP_ENTRIES(doc.obj)]) AS o
    FROM doc
  js: |-
    Object.fromEntries(Object.entries(doc.obj).map(([k, v]) => [v, k]))
  python: |-
    {str(v): k for k, v in doc["obj"].items()}
  mongo: |-
    {$arrayToObject: {$map: {input: {$objectToArray: "$obj"}, in: {k: {$toString: "$$this.v"}, v: "$$this.k"}}}}
  jq: |-
    .obj | to_entries | map({(.value|tostring): .key}) | add
- section: '5. Building & reshaping objects'
  section_color: '#7c3aed'
  title: 'Add / remove a field'
  data: |-
    doc = {"obj": {"title": "x", "a": 1}}
  bind: |-
    doc AS ({"obj":{"title":"x","a":1}})
  out: |-
    {"added":{"a":1,"draft":true,"title":"x"},"removed":{"a":1}}
  sqlpp: |-
    SELECT OBJECT_ADD(doc.obj, "draft", true) AS added,
           OBJECT_REMOVE(doc.obj, "title")    AS removed
    FROM doc
  sql: |-
    SELECT doc->'obj' || '{"draft":true}' AS added,
           doc->'obj' - 'title'           AS removed
    FROM doc
  duckdb: |-
    SELECT STRUCT_INSERT(doc.obj, draft := true) AS added,
           doc.obj.* EXCLUDE (title)             AS removed
    FROM doc
  js: |-
    ({...doc.obj, draft: true})   |   (({title, ...rest}) => rest)(doc.obj)
  python: |-
    {**doc["obj"], "draft": True}   |   {k: v for k, v in doc["obj"].items() if k != "title"}
  mongo: |-
    {$mergeObjects: ["$$ROOT", {draft: true}]}   |   {$unset: "title"}
  jq: |-
    .obj + {draft: true}   |   (.obj | del(.title))
- section: '5. Building & reshaping objects'
  section_color: '#7c3aed'
  title: 'Object → array of objects (key becomes a field)'
  data: |-
    doc = {"obj": {"x": {"n": 1}}}
  bind: |-
    doc AS ({"obj":{"x":{"n":1}}})
  out: |-
    {"a":[{"n":1,"slug":"x"}]}
  sqlpp: |-
    SELECT ARRAY OBJECT_ADD(p.val, "slug", p.name)
             FOR p IN OBJECT_PAIRS(doc.obj) END AS a
    FROM doc
  sql: |-
    SELECT JSONB_AGG(v || JSONB_BUILD_OBJECT('slug', k)) AS a
    FROM doc, JSONB_EACH(doc->'obj') AS e(k, v)
  duckdb: |-
    SELECT [STRUCT_INSERT(e.value, slug := e.key)
            for e in MAP_ENTRIES(doc.obj)] AS a
    FROM doc
  js: |-
    Object.entries(doc.obj).map(([k, v]) => ({...v, slug: k}))
  python: |-
    [{**v, "slug": k} for k, v in doc["obj"].items()]
  mongo: |-
    {$map: {input: {$objectToArray: "$obj"}, in: {$mergeObjects: ["$$this.v", {slug: "$$this.k"}]}}}
  jq: |-
    .obj | to_entries | map(.value + {slug: .key})
- section: '5. Building & reshaping objects'
  section_color: '#7c3aed'
  title: 'Array of objects → object keyed by a field'
  data: |-
    doc = {"recs": [{"slug": "x", "n": 1}]}
  bind: |-
    doc AS ({"recs":[{"slug":"x","n":1}]})
  out: |-
    {"o":{"x":{"n":1,"slug":"x"}}}
  sqlpp: |-
    SELECT OBJECT r.slug : r
             FOR r IN doc.recs END AS o
    FROM doc
  sql: |-
    SELECT JSONB_OBJECT_AGG(r->>'slug', r) AS o
    FROM doc, JSONB_ARRAY_ELEMENTS(doc->'recs') AS r
  duckdb: |-
    SELECT MAP_FROM_ENTRIES([{'k': r.slug, 'v': r}
                             for r in doc.recs]) AS o
    FROM doc
  js: |-
    Object.fromEntries(doc.recs.map(r => [r.slug, r]))
  python: |-
    {r["slug"]: r for r in doc["recs"]}
  mongo: |-
    {$arrayToObject: {$map: {input: "$recs", in: {k: "$$this.slug", v: "$$this"}}}}
  jq: |-
    .recs | map({(.slug): .}) | add
# ============================================================ 6. aggregate deeper
- section: '6. Aggregating a collection'
  section_color: '#db2777'
  title: "Collect each group's members"
  needs: 'shop'
  data: |-
    orders — the shop keyspace (20 docs), e.g.
    {"id":"1005","customer":"dave","total":22.0,"status":"shipped","ts":"2026-01-06"}
  out: |-
    one row per customer, e.g. {"customer":"dave","order_ids":["1005","1009","1013","1017"]}
  sqlpp: |-
    SELECT customer, ARRAY_AGG(id) AS order_ids
    FROM orders
    GROUP BY customer
  sql: |-
    SELECT customer, JSONB_AGG(id) AS order_ids
    FROM orders
    GROUP BY customer
  duckdb: |-
    SELECT customer, LIST(id) AS order_ids
    FROM orders
    GROUP BY customer
  js: |-
    Object.groupBy(orders, o => o.customer)   // then map ids
  python: |-
    {c: [o["id"] for o in g] for c, g in groupby(sorted(orders, key=k), k)}
  mongo: |-
    db.orders.aggregate([{$group: {_id: "$customer", order_ids: {$push: "$id"}}}])
  jq: |-
    group_by(.customer) | map({customer: .[0].customer, ids: map(.id)})

- section: '6. Aggregating a collection'
  section_color: '#db2777'
  title: 'Count occurrences (histogram)'
  data: |-
    doc = {"tags": ["a", "b", "a"]}
  bind: |-
    doc AS ({"tags":["a","b","a"]})
  out: |-
    {"value":"a","n":2}, {"value":"b","n":1}
  sqlpp: |-
    SELECT v AS `value`, COUNT(*) AS n
    FROM doc
    UNNEST doc.tags AS v
    GROUP BY v
  sql: |-
    SELECT v AS value, COUNT(*) AS n
    FROM doc, JSONB_ARRAY_ELEMENTS_TEXT(doc->'tags') AS v
    GROUP BY v
  duckdb: |-
    SELECT v AS value, COUNT(*) AS n
    FROM doc, UNNEST(doc.tags) AS t(v)
    GROUP BY v
  js: |-
    doc.tags.reduce((m, x) => (m[x] = (m[x] || 0) + 1, m), {})
  python: |-
    collections.Counter(doc["tags"])
  mongo: |-
    [{$unwind: "$tags"}, {$group: {_id: "$tags", n: {$sum: 1}}}]
  jq: |-
    .tags | reduce .[] as $x ({}; .[$x] += 1)
- section: '6. Aggregating a collection'
  section_color: '#db2777'
  title: 'Find duplicates by key'
  needs: 'shop'
  data: |-
    orders — the shop keyspace (20 docs), e.g.
    {"id":"1005","customer":"dave","total":22.0,"status":"shipped","ts":"2026-01-06"}
  out: |-
    (empty for shop — order ids are unique)
  sqlpp: |-
    SELECT id, COUNT(*) AS n
    FROM orders
    GROUP BY id
    HAVING COUNT(*) > 1
  sql: |-
    SELECT id, COUNT(*) AS n
    FROM orders
    GROUP BY id
    HAVING COUNT(*) > 1
  duckdb: |-
    SELECT id, COUNT(*) AS n
    FROM orders
    GROUP BY id
    HAVING COUNT(*) > 1
  js: |-
    // group by id, then keep buckets with length > 1
  python: |-
    [k for k, c in Counter(o["id"] for o in orders).items() if c > 1]
  mongo: |-
    [{$group: {_id: "$id", n: {$sum: 1}}}, {$match: {n: {$gt: 1}}}]
  jq: |-
    reduce .[].id as $x ({}; .[$x] += 1) | to_entries[] | select(.value > 1)

# ============================================================ 7. strings & numbers
- section: '7. Strings & numbers'
  section_color: '#16a34a'
  title: 'Split / join'
  out: |-
    {"parts":["a","b","c"],"joined":"a-b-c"}
  sqlpp: |-
    SELECT SPLIT("a,b,c", ",")         AS parts,
           CONCAT2("-", ["a","b","c"]) AS joined
  sql: |-
    SELECT STRING_TO_ARRAY('a,b,c', ',') AS parts,
           ARRAY_TO_STRING(a, '-')       AS joined
  duckdb: |-
    SELECT STRING_SPLIT('a,b,c', ',')          AS parts,
           ARRAY_TO_STRING(['a','b','c'], '-') AS joined
  js: |-
    "a,b,c".split(","); ["a","b","c"].join("-")
  python: |-
    "a,b,c".split(","); "-".join(["a","b","c"])
  mongo: |-
    {$split: ["a,b,c", ","]}; {$reduce: …}   // no direct join
  jq: |-
    split(","); join("-")

- section: '7. Strings & numbers'
  section_color: '#16a34a'
  title: 'Upcase / trim-prefix / titlecase'
  out: |-
    {"up":"ABC","trimmed":"bar","titled":"Hi There"}
  sqlpp: |-
    SELECT UPPER("abc")           AS up,
           LTRIM("foobar", "foo") AS trimmed,
           TITLE("hi there")      AS titled
  sql: |-
    SELECT UPPER(s)        AS up,
           LTRIM(s, 'foo') AS trimmed,
           INITCAP(s)      AS titled
  duckdb: |-
    SELECT UPPER(s),       AS up,
           LTRIM(s, 'foo') AS trimmed
  js: |-
    s.toUpperCase(); s.replace(/^foo/, "")
  python: |-
    s.upper(); s.removeprefix("foo"); s.title()
  mongo: |-
    {$toUpper: "$s"}; {$ltrim: {input: "$s", chars: "foo"}}
  jq: |-
    ascii_upcase; ltrimstr("foo")

- section: '7. Strings & numbers'
  section_color: '#16a34a'
  title: 'String interpolation'
  out: |-
    {"msg":"total is 3"}
  sqlpp: |-
    SELECT "total is " || TO_STRING(1 + 2) AS msg
  sql: |-
    SELECT 'total is ' || (1 + 2)::text AS msg
  duckdb: |-
    SELECT PRINTF('total is %d', 1 + 2) AS msg
  js: |-
    `total is ${1 + 2}`
  python: |-
    f"total is {1 + 2}"
  mongo: |-
    {$concat: ["total is ", {$toString: {$add: [1, 2]}}]}
  jq: |-
    "total is \(. + 1)"

- section: '7. Strings & numbers'
  section_color: '#16a34a'
  title: 'Index of a substring'
  note: |-
    ⚠ SQL++ POSITION is 0-based; Postgres/DuckDB are 1-based.
  out: |-
    {"i":1}
  sqlpp: |-
    SELECT POSITION("a, b", ", ") AS i
  sql: |-
    SELECT POSITION(', ' in 'a, b') - 1 AS i
  duckdb: |-
    SELECT STRPOS('a, b', ', ') - 1 AS i
  js: |-
    "a, b".indexOf(", ")
  python: |-
    "a, b".find(", ")
  mongo: |-
    {$indexOfCP: ["a, b", ", "]}
  jq: |-
    index(", ")

- section: '7. Strings & numbers'
  section_color: '#16a34a'
  title: 'Floor / round / sqrt / integer-divide'
  out: |-
    {"fl":3,"rnd":3.14,"sq":3,"idiv":3}
  sqlpp: |-
    SELECT FLOOR(3.7)        AS fl,
           ROUND(3.14159, 2) AS rnd,
           SQRT(9)           AS sq,
           IDIV(7, 2)        AS idiv
  sql: |-
    SELECT FLOOR(x)    AS fl,
           ROUND(x, 2) AS rnd,
           SQRT(x)     AS sq,
           DIV(7, 2)   AS idiv
  duckdb: |-
    SELECT FLOOR(x)    AS fl,
           ROUND(x, 2) AS rnd,
           SQRT(x)     AS sq,
           7 // 2      AS idiv
  js: |-
    Math.floor(x); +x.toFixed(2); Math.sqrt(x); Math.trunc(7/2)
  python: |-
    math.floor(x); round(x, 2); math.sqrt(x); 7 // 2
  mongo: |-
    {$floor}; {$round: [x, 2]}; {$sqrt}; {$trunc: {$divide: [7, 2]}}
  jq: |-
    floor; sqrt; (7 / 2 | floor)

- section: '7. Strings & numbers'
  section_color: '#16a34a'
  title: 'Name the JSON type'
  note: |-
    ⚠ SQL++ TYPE() is lowercase and distinguishes "missing" from "null".
  data: |-
    doc = {"vals": [0, false, [], {}, null, "x"]}
  bind: |-
    doc AS ({"vals":[0,false,[],{},null,"x"]})
  out: |-
    {"t":["number","boolean","array","object","null","string"]}
  sqlpp: |-
    SELECT ARRAY TYPE(v)
             FOR v IN doc.vals END AS t
    FROM doc
  sql: |-
    SELECT JSONB_AGG(JSONB_TYPEOF(v)) AS t
    FROM doc, JSONB_ARRAY_ELEMENTS(doc->'vals') AS v
  duckdb: |-
    SELECT LIST_TRANSFORM(doc.vals, x -> TYPEOF(x)) AS t
    FROM doc
  js: |-
    doc.vals.map(x => Array.isArray(x) ? "array" : typeof x)
  python: |-
    [type(x).__name__ for x in doc["vals"]]
  mongo: |-
    {$type: "$x"}
  jq: |-
    .vals | map(type)
# ============================================================ 8. recursion
- section: '8. Recursion & deep search'
  section_color: '#ea580c'
  title: 'Recurse into every descendant'
  note: |-
    SQL++'s answer to jq's .. is the WITHIN operator (descend into any nested value).
    Postgres uses jsonpath ($..); DuckDB/JS/Python/Mongo have no one-liner — you recurse.
  data: |-
    doc = {"tree": {"a": 0, "b": [1]}}
  bind: |-
    doc AS ({"tree":{"a":0,"b":[1]}})
  out: |-
    {"descendants":[0,[1],1]}
  sqlpp: |-
    SELECT ARRAY v
             FOR v WITHIN doc.tree
             END AS descendants
    FROM doc
  sql: |-
    SELECT JSONB_PATH_QUERY_ARRAY(doc->'tree', '$..*') AS descendants
    FROM doc
  duckdb: |-
    —
  js: |-
    function* walk(x){ yield x; if (x && typeof x=="object") for (const v of Object.values(x)) yield* walk(v) }
  python: |-
    # recursive generator over dict/list values
  mongo: |-
    —
  jq: |-
    [.tree | ..]
- section: '8. Recursion & deep search'
  section_color: '#ea580c'
  title: 'Does a value appear anywhere in the tree?'
  data: |-
    doc = {"tree": {"a": {"b": 5}}}
  bind: |-
    doc AS ({"tree":{"a":{"b":5}}})
  out: |-
    {"found":true}
  sqlpp: |-
    SELECT ANY v WITHIN doc.tree
                 SATISFIES v = 5 END AS found
    FROM doc
  sql: |-
    SELECT JSONB_PATH_EXISTS(doc->'tree', '$..* ? (@ == 5)') AS found
    FROM doc
  duckdb: |-
    —
  js: |-
    [...walk(doc.tree)].includes(5)
  python: |-
    any(v == 5 for v in walk(doc["tree"]))
  mongo: |-
    —
  jq: |-
    [.tree | .. | select(. == 5)] | length > 0
- section: '8. Recursion & deep search'
  section_color: '#ea580c'
  title: 'Find every object with a given id, at any depth'
  data: |-
    doc = {"tree": {"a": {"id": "x"}, "b": [{"id": "y"}]}}
  bind: |-
    doc AS ({"tree":{"a":{"id":"x"},"b":[{"id":"y"}]}})
  out: |-
    {"hits":[{"id":"y"}]}
  sqlpp: |-
    SELECT ARRAY v
             FOR v WITHIN doc.tree
             WHEN v.id = "y"
             END AS hits
    FROM doc
  sql: |-
    SELECT JSONB_PATH_QUERY_ARRAY(doc->'tree', '$..* ? (@.id == "y")') AS hits
    FROM doc
  duckdb: |-
    —
  js: |-
    [...walk(doc.tree)].filter(v => v && v.id === "y")
  python: |-
    [v for v in walk(doc["tree"]) if isinstance(v, dict) and v.get("id") == "y"]
  mongo: |-
    —
  jq: |-
    [.tree | .. | objects | select(.id == "y")]
# ============================================================ 9. reshaping
- section: '9. Reshaping records'
  section_color: '#0891b2'
  title: 'UNNEST — explode a nested array into rows'
  note: |-
    The workhorse for line-items, tags, events. SQL++ UNNEST pairs each element with its
    parent's fields.
  data: |-
    doc = {"docs": [{"id": 1, "tags": ["a", "b"]}]}
  bind: |-
    doc AS ({"docs":[{"id":1,"tags":["a","b"]}]})
  out: |-
    {"id":1,"tag":"a"} then {"id":1,"tag":"b"}
  sqlpp: |-
    SELECT o.id, t AS tag
    FROM doc
    UNNEST doc.docs AS o
    UNNEST o.tags AS t
  sql: |-
    SELECT o->>'id', t AS tag
    FROM doc, JSONB_ARRAY_ELEMENTS(doc->'docs') AS o,
              JSONB_ARRAY_ELEMENTS_TEXT(o->'tags') AS t
  duckdb: |-
    SELECT o.id, UNNEST(o.tags) AS tag
    FROM doc, UNNEST(doc.docs) AS s(o)
  js: |-
    doc.docs.flatMap(o => o.tags.map(t => ({id: o.id, tag: t})))
  python: |-
    [{"id": o["id"], "tag": t} for o in doc["docs"] for t in o["tags"]]
  mongo: |-
    [{$unwind: "$tags"}, {$project: {id: 1, tag: "$tags"}}]
  jq: |-
    .docs[] | {id, tag: .tags[]}
- section: '9. Reshaping records'
  section_color: '#0891b2'
  title: 'Reshape + rename + sort'
  data: |-
    doc = {"dms": [{"text": "hi", "sender": {"screen_name": "amy"}, "ts": 2},
                   {"text": "yo", "sender": {"screen_name": "bo"},  "ts": 1}]}
  bind: |-
    doc AS ({"dms":[{"text":"hi","sender":{"screen_name":"amy"},"ts":2},{"text":"yo","sender":{"screen_name":"bo"},"ts":1}]})
  out: |-
    {"text":"yo","from_name":"bo"} then {"text":"hi","from_name":"amy"}
  sqlpp: |-
    SELECT d.text, d.sender.screen_name AS from_name
    FROM doc
    UNNEST doc.dms AS d
    ORDER BY d.ts
  sql: |-
    SELECT d->>'text', d#>>'{sender,screen_name}' AS from_name
    FROM doc, JSONB_ARRAY_ELEMENTS(doc->'dms') AS d
    ORDER BY d->>'ts'
  duckdb: |-
    SELECT d.text, d.sender.screen_name AS from_name
    FROM doc, UNNEST(doc.dms) AS s(d)
    ORDER BY d.ts
  js: |-
    doc.dms.map(d => ({text: d.text, from: d.sender.screen_name})).sort((a,b)=>a.ts-b.ts)
  python: |-
    sorted(({"text": d["text"], "from": d["sender"]["screen_name"]} for d in doc["dms"]), key=…)
  mongo: |-
    [{$project: {text: 1, from: "$sender.screen_name"}}, {$sort: {ts: 1}}]
  jq: |-
    [.dms[] | {text, from: .sender.screen_name}] | sort_by(.ts)
- section: '9. Reshaping records'
  section_color: '#0891b2'
  title: 'Merge two arrays, flagging one'
  data: |-
    doc = {"team": [{"n": "a"}], "formerly": [{"n": "b"}]}
  bind: |-
    doc AS ({"team":[{"n":"a"}],"formerly":[{"n":"b"}]})
  out: |-
    {"everyone":[{"n":"a"},{"formerly":true,"n":"b"}]}
  sqlpp: |-
    SELECT ARRAY_CONCAT(doc.team,
                        ARRAY OBJECT_ADD(m, "formerly", true)
                          FOR m IN doc.formerly END) AS everyone
    FROM doc
  sql: |-
    SELECT (doc->'team') || (SELECT JSONB_AGG(m || '{"formerly":true}')
           FROM JSONB_ARRAY_ELEMENTS(doc->'formerly') m) AS everyone
    FROM doc
  duckdb: |-
    SELECT LIST_CONCAT(doc.team,
           [STRUCT_INSERT(m, formerly := true)
            for m in doc.formerly]) AS everyone
    FROM doc
  js: |-
    [...doc.team, ...doc.formerly.map(m => ({...m, formerly: true}))]
  python: |-
    doc["team"] + [{**m, "formerly": True} for m in doc["formerly"]]
  mongo: |-
    {$concatArrays: ["$team", {$map: {input: "$formerly", in: {$mergeObjects: ["$$this", {formerly: true}]}}}]}
  jq: |-
    [.team, (.formerly | map(. + {formerly: true}))] | flatten

# ============================================================ 10. conditionals
- section: '10. Conditionals & defaults'
  section_color: '#64748b'
  title: 'Conditionals: if / then / else'
  out: |-
    {"c":"big"}
  sqlpp: |-
    SELECT CASE WHEN 5 > 3 THEN "big" ELSE "small" END AS c
  sql: |-
    SELECT CASE WHEN 5 > 3 THEN 'big' ELSE 'small' END AS c
  duckdb: |-
    SELECT IF(5 > 3, 'big', 'small') AS c
  js: |-
    5 > 3 ? "big" : "small"
  python: |-
    "big" if 5 > 3 else "small"
  mongo: |-
    {$cond: [{$gt: [5, 3]}, "big", "small"]}
  jq: |-
    if . > 3 then "big" else "small" end

- section: '10. Conditionals & defaults'
  section_color: '#64748b'
  title: 'Default for a missing/null value'
  note: |-
    SQL++ splits what COALESCE and jq's // blur: IFMISSING / IFNULL / IFMISSINGORNULL treat
    absent and present-but-null differently.
  data: |-
    doc = {}
  bind: |-
    doc AS ({})
  out: |-
    {"v":"default"}
  sqlpp: |-
    SELECT IFMISSINGORNULL(doc.foo, "default") AS v
    FROM doc
  sql: |-
    SELECT COALESCE(doc->>'foo', 'default') AS v
    FROM doc
  duckdb: |-
    SELECT COALESCE(doc.foo, 'default') AS v
    FROM doc
  js: |-
    doc.foo ?? "default"
  python: |-
    doc.get("foo", "default")
  mongo: |-
    {$ifNull: ["$foo", "default"]}
  jq: |-
    .foo // "default"

- section: '10. Conditionals & defaults'
  section_color: '#64748b'
  title: "Type guard (jq's try/catch)"
  note: |-
    jq guards type errors with try/catch; SQL++ has no type errors — a bad op yields
    NULL/MISSING — so guard with CASE.
  data: |-
    doc = {"vals": [{"a": 1}, "str"]}
  bind: |-
    doc AS ({"vals":[{"a":1},"str"]})
  out: |-
    {"a":[1,null]}   (the string has no .a → null)
  sqlpp: |-
    SELECT ARRAY (CASE WHEN TYPE(x) = "object"
                       THEN x.a
                  END)
             FOR x IN doc.vals END AS a
    FROM doc
  sql: |-
    —
  duckdb: |-
    —
  js: |-
    doc.vals.map(x => (x && typeof x === "object" && !Array.isArray(x)) ? x.a : null)
  python: |-
    [x.get("a") if isinstance(x, dict) else None for x in doc["vals"]]
  mongo: |-
    {$cond: [{$eq: [{$type: "$x"}, "object"]}, "$x.a", null]}
  jq: |-
    .vals | map(try .a catch null)
