[[section]]
title = "9. Reshaping records"

  [[section.recipe]]
  title = "UNNEST — explode a nested array into rows"
  note = "The workhorse for line-items, tags, events. SQL++ UNNEST pairs each element with its parent's fields."
  out = '''{"id":1,"tag":"a"} then {"id":1,"tag":"b"}'''
  sqlpp = '''SELECT o.id, t AS tag FROM [{"id":1,"tags":["a","b"]}] AS o UNNEST o.tags AS t'''
  sql = '''… , jsonb_array_elements_text(o->'tags') t      -- lateral cross join'''
  duckdb = '''SELECT id, unnest(tags) AS tag FROM t'''
  js = '''arr.flatMap(o => o.tags.map(t => ({id: o.id, tag: t})))'''
  python = '''[{"id":o["id"], "tag":t} for o in arr for t in o["tags"]]'''
  mongo = '''db.c.aggregate([{$unwind:"$tags"}, {$project:{id:1, tag:"$tags"}}])'''
  jq = '''.[] | {id, tag: .tags[]}'''

  [[section.recipe]]
  title = "Array-of-rows (CSV-ish) → objects"
  out = '''{"name":"n","url":"u","category":3}'''
  sqlpp = '''SELECT r[0] AS name, r[1] AS url, TO_NUMBER(r[2]) AS category
FROM [["hdr","hdr","hdr"],["n","u","3"]][1:] AS r'''
  sql = '''(r->>2)::int FROM jsonb_array_elements(col) WITH ORDINALITY t(r,i) WHERE i > 1'''
  duckdb = '''SELECT r[1] AS name, r[2] AS url, r[3]::int AS category FROM rows[2:]'''
  js = '''rows.slice(1).map(r => ({name:r[0], url:r[1], category:+r[2]}))'''
  python = '''[{"name":r[0], "url":r[1], "category":int(r[2])} for r in rows[1:]]'''
  mongo = '''—      // load via a driver / mongoimport'''
  jq = '''.[1:] | map({name:.[0], url:.[1], category:(.[2]|tonumber)})'''

  [[section.recipe]]
  title = "Reshape + rename + sort"
  out = '''{"text":"yo","from_name":"bo"} then {"text":"hi","from_name":"amy"}'''
  sqlpp = '''SELECT d.text, d.sender.screen_name AS from_name
FROM [{"text":"hi","sender":{"screen_name":"amy"},"ts":2},
      {"text":"yo","sender":{"screen_name":"bo"},"ts":1}] AS d
ORDER BY d.ts'''
  sql = '''SELECT col->>'text', col#>>'{sender,screen_name}' FROM dms ORDER BY col->>'ts''''
  duckdb = '''SELECT text, sender.screen_name AS from_name FROM dms ORDER BY ts'''
  js = '''dms.map(d => ({text:d.text, from:d.sender.screen_name})).sort((a,b)=>a.ts-b.ts)'''
  python = '''sorted(({"text":d["text"], "from":d["sender"]["screen_name"]} for d in dms), key=…)'''
  mongo = '''db.dms.aggregate([{$project:{text:1, from:"$sender.screen_name"}}, {$sort:{ts:1}}])'''
  jq = '''[.[] | {text, from:.sender.screen_name}] | sort_by(.date)'''

  [[section.recipe]]
  title = "Merge two arrays, flagging one"
  out = '''{"everyone":[{"n":"a"},{"formerly":true,"n":"b"}]}'''
  sqlpp = '''SELECT ARRAY_CONCAT(d.team,
       ARRAY OBJECT_ADD(m,"formerly",true) FOR m IN d.formerly END) AS everyone
FROM [{"team":[{"n":"a"}],"formerly":[{"n":"b"}]}] AS d'''
  sql = '''(col->'team') || (SELECT jsonb_agg(m || '{"formerly":true}') FROM jsonb_array_elements(col->'formerly') m)'''
  duckdb = '''list_concat(team, [struct_insert(m, formerly := true) for m in formerly])'''
  js = '''[...d.team, ...d.formerly.map(m => ({...m, formerly:true}))]'''
  python = '''d["team"] + [{**m, "formerly":True} for m in d["formerly"]]'''
  mongo = '''{$concatArrays:["$team", {$map:{input:"$formerly", in:{$mergeObjects:["$$this",{formerly:true}]}}}]}'''
  jq = '''[.team, (.formerly | map(.+{formerly:true}))] | flatten'''

