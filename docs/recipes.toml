[[section]]
title = "8. Recursion & deep search"
intro = "SQL++'s answer to jq's .. is the WITHIN operator (descend into any nested value) plus ANY … WITHIN … SATISFIES. Postgres uses jsonpath ($..). DuckDB/JS/Python/Mongo have no clean one-liner — you recurse."

  [[section.recipe]]
  title = "Recurse into every descendant — .."
  out = '''{"descendants":[0,[1],1]}'''
  sqlpp = '''SELECT ARRAY v FOR v WITHIN {"a":0,"b":[1]} END AS descendants'''
  sql = '''jsonb_path_query(col, '$..*')'''
  duckdb = '''—'''
  js = '''function* walk(x){ yield x; if (x && typeof x=="object") for (const v of Object.values(x)) yield* walk(v) }'''
  python = '''# recursive generator over dict/list values'''
  mongo = '''—'''
  jq = '''..'''

  [[section.recipe]]
  title = "Does value X appear anywhere in the tree?"
  out = '''{"found":true}'''
  sqlpp = '''SELECT ANY v WITHIN {"a":{"b":5}} SATISFIES v = 5 END AS found'''
  sql = '''jsonb_path_exists(col, '$..* ? (@ == 5)')'''
  duckdb = '''—'''
  js = '''[...walk(o)].includes(5)'''
  python = '''any(v == 5 for v in walk(o))'''
  mongo = '''—'''
  jq = '''[.. | select(. == 5)] | length > 0'''

  [[section.recipe]]
  title = "Find every object with a given id, at any depth"
  out = '''{"hits":[{"id":"y"}]}'''
  sqlpp = '''SELECT ARRAY v FOR v WITHIN {"a":{"id":"x"},"b":[{"id":"y"}]} WHEN v.id = "y" END AS hits'''
  sql = '''jsonb_path_query(col, '$..* ? (@.id == "y")')'''
  duckdb = '''—'''
  js = '''[...walk(o)].filter(v => v && v.id === "y")'''
  python = '''[v for v in walk(o) if isinstance(v, dict) and v.get("id") == "y"]'''
  mongo = '''—'''
  jq = '''[.. | objects | select(.id == "y")]'''

