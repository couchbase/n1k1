[[section]]
title = "7. Strings & numbers"

  [[section.recipe]]
  title = "split / join"
  out = '''{"parts":["a","b","c"],"joined":"a-b-c"}'''
  sqlpp = '''SELECT SPLIT("a,b,c", ",") AS parts, CONCAT2("-", ["a","b","c"]) AS joined'''
  sql = '''string_to_array('a,b,c', ','); array_to_string(a, '-')'''
  duckdb = '''string_split('a,b,c', ','); array_to_string(['a','b','c'], '-')'''
  js = '''"a,b,c".split(","); ["a","b","c"].join("-")'''
  python = '''"a,b,c".split(","); "-".join(["a","b","c"])'''
  mongo = '''{$split:["a,b,c", ","]}; {$reduce:…}   // no direct join'''
  jq = '''split(","); join("-")'''

  [[section.recipe]]
  title = "upcase / trim-prefix / titlecase"
  out = '''{"up":"ABC","trimmed":"bar","titled":"Hi There"}'''
  sqlpp = '''SELECT UPPER("abc") AS up, LTRIM("foobar","foo") AS trimmed, TITLE("hi there") AS titled'''
  sql = '''upper(s); ltrim(s, 'foo'); initcap(s)'''
  duckdb = '''upper(s); ltrim(s, 'foo')'''
  js = '''s.toUpperCase(); s.replace(/^foo/, "")'''
  python = '''s.upper(); s.removeprefix("foo"); s.title()'''
  mongo = '''{$toUpper:"$s"}; {$ltrim:{input:"$s", chars:"foo"}}'''
  jq = '''ascii_upcase; ltrimstr("foo")'''

  [[section.recipe]]
  title = "String interpolation"
  out = '''{"msg":"total is 3"}'''
  sqlpp = '''SELECT "total is " || TO_STRING(1+2) AS msg'''
  sql = ''''total is ' || (1+2)::text'''
  duckdb = '''printf('total is %d', 1+2)'''
  js = '''`total is ${1+2}`'''
  python = '''f"total is {1+2}"'''
  mongo = '''{$concat:["total is ", {$toString:{$add:[1,2]}}]}'''
  jq = '''"total is \(.+1)"'''

  [[section.recipe]]
  title = "index of a substring"
  note = "⚠ SQL++ POSITION is 0-based; Postgres/DuckDB are 1-based."
  out = '''{"i":1}'''
  sqlpp = '''SELECT POSITION("a, b", ", ") AS i'''
  sql = '''position(', ' in 'a, b') - 1'''
  duckdb = '''strpos('a, b', ', ') - 1'''
  js = '''"a, b".indexOf(", ")'''
  python = '''"a, b".find(", ")'''
  mongo = '''{$indexOfCP:["a, b", ", "]}'''
  jq = '''index(", ")'''

  [[section.recipe]]
  title = "Numeric — floor / round / sqrt / integer-divide"
  out = '''{"fl":3,"rnd":3.14,"sq":3,"idiv":3}'''
  sqlpp = '''SELECT FLOOR(3.7) AS fl, ROUND(3.14159,2) AS rnd, SQRT(9) AS sq, IDIV(7,2) AS idiv'''
  sql = '''floor(x); round(x,2); sqrt(x); div(7,2)'''
  duckdb = '''floor(x); round(x,2); sqrt(x); 7 // 2'''
  js = '''Math.floor(x); +x.toFixed(2); Math.sqrt(x); Math.trunc(7/2)'''
  python = '''math.floor(x); round(x,2); math.sqrt(x); 7 // 2'''
  mongo = '''{$floor:"$x"}; {$round:["$x",2]}; {$sqrt:"$x"}; {$trunc:{$divide:[7,2]}}'''
  jq = '''floor; sqrt; (7/2 | floor)'''

  [[section.recipe]]
  title = "type — name the JSON type"
  note = "⚠ SQL++ TYPE() is lowercase and distinguishes \"missing\" from \"null\"."
  out = '''{"t":["number","boolean","array","object","null","string"]}'''
  sqlpp = '''SELECT ARRAY TYPE(v) FOR v IN [0,false,[],{},null,"x"] END AS t'''
  sql = '''jsonb_typeof(value)'''
  duckdb = '''typeof(v); json_type(j)'''
  js = '''typeof x; Array.isArray(x)'''
  python = '''type(x).__name__'''
  mongo = '''{$type:"$x"}'''
  jq = '''type      # (jq has no "missing")'''

