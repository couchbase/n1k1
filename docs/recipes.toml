# =============================================================================
[[section]]
title = "1. Access & navigation"

  [[section.recipe]]
  title = "Field access — .foo, .foo.bar"
  needs = "shop"
  out = '''"dave", "alice", … (one per order)'''
  sqlpp = '''SELECT RAW o.customer FROM orders o'''
  sql = '''SELECT col->>'customer' FROM orders'''
  duckdb = '''SELECT customer FROM orders'''
  js = '''orders.map(o => o.customer)'''
  python = '''[o["customer"] for o in orders]'''
  mongo = '''db.orders.find({}, {customer: 1, _id: 0})'''
  jq = '''.customer'''

  [[section.recipe]]
  title = "Optional / missing field"
  note = "jq's ? suppresses errors on non-objects; SQL++ has no error — a missing path is MISSING and just drops out."
  out = '''{}   (foo is MISSING, so the key is omitted)'''
  sqlpp = '''SELECT x.foo FROM [{"bar":1}] AS x'''
  sql = '''SELECT col->'foo'      -- NULL if absent'''
  duckdb = '''SELECT col->'$.foo'  -- NULL if absent'''
  js = '''[{bar:1}].map(x => x.foo)      // [undefined]'''
  python = '''[x.get("foo") for x in [{"bar":1}]]   # [None]'''
  mongo = '''// a missing field is simply absent from the result'''
  jq = '''.foo      # → null   (.foo? to suppress errors on non-objects)'''

  [[section.recipe]]
  title = "Array index — 0-based, negatives from the end"
  out = '''{"first":10,"last":30,"penult":20}'''
  sqlpp = '''SELECT [10,20,30][0]  AS `first`,
       [10,20,30][-1] AS `last`,
       [10,20,30][-2] AS penult'''
  sql = '''col->0, col->-1        -- jsonb: 0-based, -1 = last'''
  duckdb = '''[10,20,30][1], [10,20,30][-1]   -- ⚠ DuckDB lists are 1-based'''
  js = '''a[0]; a.at(-1)'''
  python = '''a[0]; a[-1]'''
  mongo = '''{$arrayElemAt: ["$a", 0]}, {$arrayElemAt: ["$a", -1]}'''
  jq = '''.[0], .[-1]'''

  [[section.recipe]]
  title = "Slice — arr[2:4]"
  out = '''{"s":["c","d"]}'''
  sqlpp = '''SELECT ["a","b","c","d","e"][2:4] AS s'''
  sql = '''jsonb_path_query(col, '$[2 to 3]')   -- SQLite has no slice'''
  duckdb = '''['a','b','c','d','e'][3:4]   -- ⚠ 1-based, inclusive → ['c','d']'''
  js = '''a.slice(2, 4)'''
  python = '''a[2:4]'''
  mongo = '''{$slice: ["$a", 2, 2]}'''
  jq = '''.[2:4]'''

# =============================================================================
[[section]]
title = "2. Iterating & projecting"
intro = "The pivot between the models: SQL++/SQL/DuckDB scan a collection, JS/Python loop, MongoDB pipelines, jq streams."

  [[section.recipe]]
  title = "Iterate — one output per element"
  out = '''{"name":"JSON"} then {"name":"XML"}'''
  sqlpp = '''SELECT RAW x FROM [{"name":"JSON"},{"name":"XML"}] AS x'''
  sql = '''SELECT value FROM jsonb_array_elements(col)'''
  duckdb = '''SELECT unnest([{'name':'JSON'},{'name':'XML'}], recursive := false)'''
  js = '''for (const x of arr) { … }'''
  python = '''for x in arr: ...'''
  mongo = '''db.c.find()      // each document'''
  jq = '''.[]'''

  [[section.recipe]]
  title = "Project a field from each element"
  out = '''"JSON", "XML"'''
  sqlpp = '''SELECT RAW x.name FROM [{"name":"JSON"},{"name":"XML"}] AS x'''
  sql = '''SELECT e->>'name' FROM jsonb_array_elements(col) e'''
  duckdb = '''SELECT x.name FROM (SELECT unnest(arr) x)'''
  js = '''arr.map(x => x.name)'''
  python = '''[x["name"] for x in arr]'''
  mongo = '''db.c.find({}, {name: 1, _id: 0})'''
  jq = '''.[] | .name'''

  [[section.recipe]]
  title = "map — transform each element into an array"
  note = "SQL++ array comprehension ARRAY f FOR x IN arr END returns one array value; a SELECT scans instead."
  out = '''{"r":[2,3,4]}'''
  sqlpp = '''SELECT ARRAY v+1 FOR v IN [1,2,3] END AS r'''
  sql = '''jsonb_agg(value::int + 1) FROM jsonb_array_elements('[1,2,3]')'''
  duckdb = '''[x + 1 for x in [1,2,3]]      -- list comprehension'''
  js = '''[1,2,3].map(x => x + 1)'''
  python = '''[x + 1 for x in [1,2,3]]'''
  mongo = '''{$map: {input: [1,2,3], as: "v", in: {$add: ["$$v", 1]}}}'''
  jq = '''map(.+1)'''

  [[section.recipe]]
  title = "Collect elements into an array — [ … ]"
  out = '''{"r":["s","jq","wf"]}'''
  sqlpp = '''SELECT ARRAY_PREPEND(o.user, o.projects) AS r
FROM [{"user":"s","projects":["jq","wf"]}] AS o'''
  sql = '''col->'user' || col->'projects'    -- jsonb || concatenates'''
  duckdb = '''list_prepend(user, projects)'''
  js = '''[o.user, ...o.projects]'''
  python = '''[o["user"], *o["projects"]]'''
  mongo = '''{$concatArrays: [["$user"], "$projects"]}'''
  jq = '''[.user, .projects[]]'''

  [[section.recipe]]
  title = "Object construction — { }"
  note = "Keys inside a constructed object render sorted (canonical JSON): title before user."
  out = '''{"doc":{"title":"JQ","user":"s"}}'''
  sqlpp = '''SELECT {"user": o.user, "title": o.title} AS doc
FROM [{"user":"s","title":"JQ"}] AS o'''
  sql = '''jsonb_build_object('user', col->'user', 'title', col->'title')'''
  duckdb = '''{'user': o.user, 'title': o.title}      -- a STRUCT'''
  js = '''({ user: o.user, title: o.title })'''
  python = '''{"user": o["user"], "title": o["title"]}'''
  mongo = '''{$project: {user: 1, title: 1, _id: 0}}'''
  jq = '''{user, title}'''

  [[section.recipe]]
  title = "Dynamic keys — key comes from the data"
  note = "Object comprehension with a dynamic key expression. ⚠ Keys must be strings; `value` is a reserved word (back-quoted)."
  out = '''{"o":{"a":1}}'''
  sqlpp = '''SELECT OBJECT r.label : r.`value` FOR r IN [{"label":"a","value":1}] END AS o'''
  sql = '''jsonb_object_agg(e->>'label', e->'value')'''
  duckdb = '''map_from_entries([{'k': r.label, 'v': r.value}])'''
  js = '''Object.fromEntries(arr.map(r => [r.label, r.value]))'''
  python = '''{r["label"]: r["value"] for r in arr}'''
  mongo = '''{$arrayToObject: [[{k: "$label", v: "$value"}]]}'''
  jq = '''map({(.label): .value}) | add'''

# =============================================================================
[[section]]
title = "3. Filtering & selecting"

  [[section.recipe]]
  title = "Keep elements matching a condition"
  out = '''5, 3, 7'''
  sqlpp = '''SELECT RAW v FROM [1,5,3,0,7] AS v WHERE v >= 2'''
  sql = '''SELECT value FROM jsonb_array_elements('[1,5,3,0,7]') WHERE value::int >= 2'''
  duckdb = '''[x for x in [1,5,3,0,7] if x >= 2]'''
  js = '''[1,5,3,0,7].filter(x => x >= 2)'''
  python = '''[x for x in [1,5,3,0,7] if x >= 2]'''
  mongo = '''{$filter: {input: [1,5,3,0,7], cond: {$gte: ["$$this", 2]}}}'''
  jq = '''map(select(. >= 2))'''

  [[section.recipe]]
  title = "has / missing a key"
  out = '''{"has":true} then {"has":false}'''
  sqlpp = '''SELECT x.endpoint IS NOT MISSING AS has FROM [{"endpoint":1},{}] AS x'''
  sql = '''col ? 'endpoint'          -- jsonb key-exists'''
  duckdb = '''json_exists(col, '$.endpoint')'''
  js = '''"endpoint" in x'''
  python = '''"endpoint" in x'''
  mongo = '''{endpoint: {$exists: true}}'''
  jq = '''has("endpoint")'''

  [[section.recipe]]
  title = "contains / startswith — substring & prefix"
  out = '''{"r":[false,true,true]}'''
  sqlpp = '''SELECT ARRAY s LIKE "foo%" FOR s IN ["fo","foo","foobar"] END AS r'''
  sql = '''value LIKE 'foo%''''
  duckdb = '''starts_with(s, 'foo')'''
  js = '''s.startsWith("foo")'''
  python = '''s.startswith("foo")'''
  mongo = '''{$regexMatch: {input: "$s", regex: "^foo"}}'''
  jq = '''startswith("foo")'''

  [[section.recipe]]
  title = "regex match"
  out = '''{"m":true}'''
  sqlpp = '''SELECT REGEXP_CONTAINS("foo123", "[0-9]+") AS m'''
  sql = ''''foo123' ~ '[0-9]+''''
  duckdb = '''regexp_matches('foo123', '[0-9]+')'''
  js = '''/[0-9]+/.test("foo123")'''
  python = '''bool(re.search(r"[0-9]+", "foo123"))'''
  mongo = '''{$regexMatch: {input: "foo123", regex: "[0-9]+"}}'''
  jq = '''test("[0-9]+")'''

# =============================================================================
[[section]]
title = "4. Objects ↔ entries (keys, pairs, pivots)"

  [[section.recipe]]
  title = "keys — list an object's field names"
  out = '''{"k":["a","b"]}'''
  sqlpp = '''SELECT OBJECT_NAMES({"b":2,"a":1}) AS k'''
  sql = '''jsonb_object_keys(col)      -- one row per key'''
  duckdb = '''json_keys('{"b":2,"a":1}')'''
  js = '''Object.keys({b:2, a:1})'''
  python = '''list({"b":2,"a":1}.keys())'''
  mongo = '''{$map: {input: {$objectToArray: "$obj"}, in: "$$this.k"}}'''
  jq = '''keys      # sorted'''

  [[section.recipe]]
  title = "to_entries — object → array of pairs"
  note = "⚠ SQL++ OBJECT_PAIRS yields {name, val}; jq yields {key, value}."
  out = '''{"p":[{"name":"a","val":1},{"name":"b","val":2}]}'''
  sqlpp = '''SELECT OBJECT_PAIRS({"a":1,"b":2}) AS p'''
  sql = '''jsonb_each(col)      -- rows (key, value)'''
  duckdb = '''map_entries(MAP {'a':1, 'b':2})   -- [{key,value}]'''
  js = '''Object.entries({a:1, b:2})      // [["a",1],["b",2]]'''
  python = '''list({"a":1,"b":2}.items())'''
  mongo = '''{$objectToArray: "$obj"}      // [{k,v}]'''
  jq = '''to_entries      # [{key,value}]'''

  [[section.recipe]]
  title = "from_entries — pairs → object"
  out = '''{"o":{"a":1}}'''
  sqlpp = '''SELECT OBJECT p.name : p.val FOR p IN [{"name":"a","val":1}] END AS o'''
  sql = '''jsonb_object_agg(e->>'key', e->'value')'''
  duckdb = '''map_from_entries([{'k':'a', 'v':1}])'''
  js = '''Object.fromEntries([["a", 1]])'''
  python = '''dict([("a", 1)])'''
  mongo = '''{$arrayToObject: [[{k: "a", v: 1}]]}'''
  jq = '''from_entries'''

  [[section.recipe]]
  title = "Swap keys and values"
  out = '''{"o":{"1":"a","2":"b"}}'''
  sqlpp = '''SELECT OBJECT TO_STRING(p.val) : p.name FOR p IN OBJECT_PAIRS({"a":1,"b":2}) END AS o'''
  sql = '''jsonb_object_agg(v#>>'{}', k) FROM jsonb_each(obj) e(k,v)'''
  duckdb = '''map_from_entries([{'k': e.value::VARCHAR, 'v': e.key} for e in map_entries(m)])'''
  js = '''Object.fromEntries(Object.entries(o).map(([k,v]) => [v, k]))'''
  python = '''{str(v): k for k, v in o.items()}'''
  mongo = '''{$arrayToObject: {$map: {input: {$objectToArray:"$o"}, in: {k: {$toString:"$$this.v"}, v: "$$this.k"}}}}'''
  jq = '''to_entries | map({(.value): .key}) | add'''

  [[section.recipe]]
  title = "map_values — transform every value, keep keys"
  out = '''{"o":{"a":2,"b":3}}'''
  sqlpp = '''SELECT OBJECT p.name : p.val+1 FOR p IN OBJECT_PAIRS({"a":1,"b":2}) END AS o'''
  sql = '''jsonb_object_agg(k, (v::int)+1) FROM jsonb_each(obj) e(k,v)'''
  duckdb = '''map_from_entries([{'k': e.key, 'v': e.value + 1} for e in map_entries(m)])'''
  js = '''Object.fromEntries(Object.entries(o).map(([k,v]) => [k, v+1]))'''
  python = '''{k: v + 1 for k, v in o.items()}'''
  mongo = '''{$arrayToObject: {$map: {input: {$objectToArray:"$o"}, in: {k: "$$this.k", v: {$add:["$$this.v",1]}}}}}'''
  jq = '''map_values(.+1)'''

  [[section.recipe]]
  title = "Add / remove a field"
  out = '''{"added":{"a":1,"draft":true},"removed":{"a":1}}'''
  sqlpp = '''SELECT OBJECT_ADD({"a":1}, "draft", true)          AS added,
       OBJECT_REMOVE({"title":"x","a":1}, "title")   AS removed'''
  sql = '''col || '{"draft":true}'   |   col - 'title''''
  duckdb = '''struct_insert(s, draft := true)   |   s.* EXCLUDE (title)'''
  js = '''({...o, draft:true})   |   (({title, ...rest}) => rest)(o)'''
  python = '''{**o, "draft":True}   |   {k:v for k,v in o.items() if k != "title"}'''
  mongo = '''{$mergeObjects:["$$ROOT",{draft:true}]}   |   {$unset:"title"}'''
  jq = '''. + {draft:true}   |   del(.title)'''

  [[section.recipe]]
  title = "Pivot: object → array of objects (key becomes a field)"
  out = '''{"a":[{"n":1,"slug":"x"}]}'''
  sqlpp = '''SELECT ARRAY OBJECT_ADD(p.val, "slug", p.name) FOR p IN OBJECT_PAIRS({"x":{"n":1}}) END AS a'''
  sql = '''jsonb_agg(v || jsonb_build_object('slug', k))'''
  duckdb = '''[struct_insert(e.value, slug := e.key) for e in map_entries(m)]'''
  js = '''Object.entries(o).map(([k,v]) => ({...v, slug:k}))'''
  python = '''[{**v, "slug":k} for k, v in o.items()]'''
  mongo = '''{$map: {input: {$objectToArray:"$o"}, in: {$mergeObjects:["$$this.v",{slug:"$$this.k"}]}}}'''
  jq = '''to_entries | map(.value + {slug:.key})'''

  [[section.recipe]]
  title = "Pivot: array of objects → object keyed by a field"
  out = '''{"o":{"x":{"slug":"x","n":1}}}'''
  sqlpp = '''SELECT OBJECT r.slug : r FOR r IN [{"slug":"x","n":1}] END AS o'''
  sql = '''jsonb_object_agg(e->>'slug', e)'''
  duckdb = '''map_from_entries([{'k': r.slug, 'v': r} for r in arr])'''
  js = '''Object.fromEntries(arr.map(r => [r.slug, r]))'''
  python = '''{r["slug"]: r for r in arr}'''
  mongo = '''{$arrayToObject: {$map: {input:"$arr", in: {k:"$$this.slug", v:"$$this"}}}}'''
  jq = '''map({(.slug): .}) | add'''

# =============================================================================
[[section]]
title = "5. Aggregating & grouping"
intro = "SQL's home turf — GROUP BY and aggregates — meets jq's group_by / unique / add / max_by. MongoDB's aggregation pipeline is the natural fit here."

  [[section.recipe]]
  title = "length / count"
  out = '''{"arr":3,"str":3,"obj":1}'''
  sqlpp = '''SELECT ARRAY_LENGTH([1,2,3]) AS arr, LENGTH("abc") AS str, OBJECT_LENGTH({"a":1}) AS obj'''
  sql = '''jsonb_array_length('[1,2,3]')'''
  duckdb = '''len([1,2,3]); length('abc')'''
  js = '''[1,2,3].length; "abc".length; Object.keys(o).length'''
  python = '''len([1,2,3]); len("abc"); len(o)'''
  mongo = '''{$size:"$arr"}; {$strLenCP:"$s"}'''
  jq = '''length'''

  [[section.recipe]]
  title = "add / sum / min / max / avg over an array"
  out = '''{"s":6,"mx":3,"a":2}'''
  sqlpp = '''SELECT ARRAY_SUM([1,2,3]) AS s, ARRAY_MAX([1,2,3]) AS mx, ARRAY_AVG([1,2,3]) AS a'''
  sql = '''sum(value::int) FROM jsonb_array_elements('[1,2,3]')'''
  duckdb = '''list_sum([1,2,3]); list_max([1,2,3]); list_avg([1,2,3])'''
  js = '''arr.reduce((a,b) => a+b, 0); Math.max(...arr)'''
  python = '''sum(arr); max(arr); statistics.mean(arr)'''
  mongo = '''{$sum:"$a"}; {$max:"$a"}; {$avg:"$a"}'''
  jq = '''add; max; (add/length)'''

  [[section.recipe]]
  title = "Aggregate over a collection"
  needs = "shop"
  out = '''{"n":20,"revenue":1949.36,"avg":97.47}'''
  sqlpp = '''SELECT COUNT(*) AS n, ROUND(SUM(o.total),2) AS revenue, ROUND(AVG(o.total),2) AS avg
FROM orders o'''
  sql = '''SELECT count(*), sum(total), avg(total) FROM orders'''
  duckdb = '''SELECT count(*), sum(total), avg(total) FROM orders'''
  js = '''orders.reduce((a,o) => a + o.total, 0)'''
  python = '''sum(o["total"] for o in orders)'''
  mongo = '''db.orders.aggregate([{$group:{_id:null, n:{$sum:1}, revenue:{$sum:"$total"}, avg:{$avg:"$total"}}}])'''
  jq = '''[.[].total] | add'''

  [[section.recipe]]
  title = "group_by — cluster, then aggregate"
  needs = "shop"
  out = '''{"status":"shipped","n":16,"revenue":1758.73}, {"status":"pending",…}, {"status":"cancelled",…}'''
  sqlpp = '''SELECT o.status, COUNT(*) AS n, ROUND(SUM(o.total),2) AS revenue
FROM orders o GROUP BY o.status ORDER BY revenue DESC'''
  sql = '''SELECT status, count(*), sum(total) FROM orders GROUP BY status ORDER BY 3 DESC'''
  duckdb = '''SELECT status, count(*), sum(total) FROM orders GROUP BY status ORDER BY 3 DESC'''
  js = '''Object.groupBy(orders, o => o.status)      // then reduce each bucket'''
  python = '''df.groupby("status").total.agg(["count","sum"])      # pandas'''
  mongo = '''db.orders.aggregate([{$group:{_id:"$status", n:{$sum:1}, revenue:{$sum:"$total"}}}, {$sort:{revenue:-1}}])'''
  jq = '''group_by(.status)      # → array of arrays'''

  [[section.recipe]]
  title = "Collect each group's members"
  needs = "shop"
  out = '''one row per customer, e.g. {"customer":"dave","order_ids":["1005","1009","1013","1017"]}'''
  sqlpp = '''SELECT o.customer, ARRAY_AGG(o.id) AS order_ids FROM orders o GROUP BY o.customer'''
  sql = '''SELECT customer, jsonb_agg(id) FROM orders GROUP BY customer'''
  duckdb = '''SELECT customer, list(id) FROM orders GROUP BY customer'''
  js = '''Object.groupBy(orders, o => o.customer)      // then map ids'''
  python = '''{c: [o["id"] for o in g] for c, g in groupby(sorted(orders,key=k), k)}'''
  mongo = '''db.orders.aggregate([{$group:{_id:"$customer", order_ids:{$push:"$id"}}}])'''
  jq = '''group_by(.customer) | map({customer:.[0].customer, ids:map(.id)})'''

  [[section.recipe]]
  title = "unique / dedup"
  note = "ARRAY_DISTINCT keeps first-seen order; wrap in ARRAY_SORT for jq's sorted result."
  out = '''{"u":[1,2,5,3]}'''
  sqlpp = '''SELECT ARRAY_DISTINCT([1,2,5,3,5,3,1]) AS u'''
  sql = '''SELECT DISTINCT value FROM jsonb_array_elements('[…]')'''
  duckdb = '''list_distinct([1,2,5,3,5,3,1])'''
  js = '''[...new Set([1,2,5,3,5,3,1])]'''
  python = '''list(dict.fromkeys([1,2,5,3,5,3,1]))'''
  mongo = '''{$setUnion: ["$a", []]}      // unordered'''
  jq = '''unique      # sorted'''

  [[section.recipe]]
  title = "sort_by"
  needs = "shop"
  out = '''{"id":"1020","total":389.99}, {"id":"1019","total":245.0}, {"id":"1003","total":210.00}'''
  sqlpp = '''SELECT o.id, o.total FROM orders o ORDER BY o.total DESC LIMIT 3'''
  sql = '''SELECT id, total FROM orders ORDER BY total DESC'''
  duckdb = '''SELECT id, total FROM orders ORDER BY total DESC'''
  js = '''orders.toSorted((a,b) => b.total - a.total)'''
  python = '''sorted(orders, key=lambda o: -o["total"])'''
  mongo = '''db.orders.aggregate([{$sort:{total:-1}}])'''
  jq = '''sort_by(.total)'''

  [[section.recipe]]
  title = "min_by / max_by — the extreme record"
  needs = "shop"
  out = '''the single priciest order (whole row)'''
  sqlpp = '''SELECT o.* FROM orders o ORDER BY o.total DESC LIMIT 1'''
  sql = '''SELECT * FROM orders ORDER BY total DESC LIMIT 1'''
  duckdb = '''SELECT max_by(orders, total) FROM orders'''
  js = '''orders.reduce((m,o) => o.total > m.total ? o : m)'''
  python = '''max(orders, key=lambda o: o["total"])'''
  mongo = '''db.orders.aggregate([{$sort:{total:-1}}, {$limit:1}])'''
  jq = '''max_by(.total)'''

  [[section.recipe]]
  title = "Count occurrences / histogram"
  out = '''{"value":"a","n":2}, {"value":"b","n":1}'''
  sqlpp = '''SELECT v AS `value`, COUNT(*) AS n FROM ["a","b","a"] AS v GROUP BY v'''
  sql = '''SELECT value, count(*) FROM jsonb_array_elements_text('["a","b","a"]') GROUP BY value'''
  duckdb = '''SELECT v, count(*) FROM (SELECT unnest(['a','b','a']) v) GROUP BY v'''
  js = '''arr.reduce((m,x) => (m[x]=(m[x]||0)+1, m), {})'''
  python = '''collections.Counter(["a","b","a"])'''
  mongo = '''db.c.aggregate([{$unwind:"$v"}, {$group:{_id:"$v", n:{$sum:1}}}])'''
  jq = '''reduce .[] as $x ({}; .[$x] += 1)'''

  [[section.recipe]]
  title = "Find duplicates by key"
  needs = "shop"
  out = '''(empty for shop — ids are unique)'''
  sqlpp = '''SELECT o.id, COUNT(*) AS n FROM orders o GROUP BY o.id HAVING COUNT(*) > 1'''
  sql = '''SELECT id, count(*) FROM orders GROUP BY id HAVING count(*) > 1'''
  duckdb = '''SELECT id, count(*) FROM orders GROUP BY id HAVING count(*) > 1'''
  js = '''// group by id, then keep buckets with length > 1'''
  python = '''[k for k, c in Counter(o["id"] for o in orders).items() if c > 1]'''
  mongo = '''db.orders.aggregate([{$group:{_id:"$id", n:{$sum:1}}}, {$match:{n:{$gt:1}}}])'''
  jq = '''reduce .[].id as $x ({}; .[$x]+=1) | to_entries[] | select(.value>1)'''

