[[section]]
title = "6. Arrays"

  [[section.recipe]]
  title = "flatten"
  note = "⚠ SQL++ ARRAY_FLATTEN(arr, depth) needs an explicit depth; jq flattens fully."
  out = '''{"f":[1,2,3]}'''
  sqlpp = '''SELECT ARRAY_FLATTEN([1,[2],[[3]]], 2) AS f'''
  sql = '''-- recursive unnest; no single builtin'''
  duckdb = '''flatten([[1],[2],[3]])      -- one level only'''
  js = '''[1,[2],[[3]]].flat(2)'''
  python = '''# no deep builtin; recurse, or itertools.chain for one level'''
  mongo = '''{$reduce:{input:"$a", initialValue:[], in:{$concatArrays:["$$value","$$this"]}}}   // one level'''
  jq = '''flatten'''

  [[section.recipe]]
  title = "reverse / range / append / concat"
  out = '''{"rev":[3,2,1],"rng":[2,3],"app":[1,2,3],"cat":[1,2]}'''
  sqlpp = '''SELECT ARRAY_REVERSE([1,2,3]) AS rev, ARRAY_RANGE(2,4) AS rng,
       ARRAY_APPEND([1,2],3) AS app, ARRAY_CONCAT([1],[2]) AS cat'''
  sql = '''a || b; generate_series(2,3)'''
  duckdb = '''list_reverse(a); range(2,4); list_append(a,x); list_concat(a,b)'''
  js = '''a.toReversed(); [...Array(2).keys()].map(i=>i+2); [...a,x]; a.concat(b)'''
  python = '''a[::-1]; list(range(2,4)); a+[x]; a+b'''
  mongo = '''{$reverseArray:"$a"}; {$range:[2,4]}; {$concatArrays:["$a",[x]]}'''
  jq = '''reverse; [range(2;4)]; . + [x]; .a + .b'''

  [[section.recipe]]
  title = "Every other element (even indices)"
  note = "Index by a stepped range — OBJECT_PAIRS works only on objects, not arrays."
  out = '''{"evens":["a","c"]}'''
  sqlpp = '''SELECT ARRAY a[i] FOR i IN ARRAY_RANGE(0, ARRAY_LENGTH(a), 2) END AS evens
FROM [["a","b","c","d"]] AS a'''
  sql = '''jsonb_agg(value) … WITH ORDINALITY t(value,i) WHERE i%2 = 1'''
  duckdb = '''list_slice(['a','b','c','d'], 1, 4, 2)      -- 1-based, step 2'''
  js = '''arr.filter((_, i) => i % 2 === 0)'''
  python = '''arr[::2]'''
  mongo = '''{$map:{input:{$range:[0,{$size:"$a"},2]}, in:{$arrayElemAt:["$a","$$this"]}}}'''
  jq = '''[range(0; length; 2) as $i | .[$i]]'''

  [[section.recipe]]
  title = "Chunk into fixed-size groups"
  note = "⚠ Clamp the slice end with LEAST(…, ARRAY_LENGTH(a)) — a slice past the end is MISSING, dropping the final short chunk."
  out = '''{"chunks":[[1,2],[3,4],[5]]}'''
  sqlpp = '''SELECT ARRAY a[i:LEAST(i+2, ARRAY_LENGTH(a))]
       FOR i IN ARRAY_RANGE(0, ARRAY_LENGTH(a), 2) END AS chunks
FROM [[1,2,3,4,5]] AS a'''
  sql = '''-- window / ntile, or generate_series with slicing'''
  duckdb = '''[a[i+1 : i+2] for i in range(0, len(a), 2)]'''
  js = '''Array.from({length: Math.ceil(a.length/2)}, (_,i) => a.slice(i*2, i*2+2))'''
  python = '''[a[i:i+2] for i in range(0, len(a), 2)]'''
  mongo = '''—'''
  jq = '''[range(0; length; 2) as $i | .[$i:$i+2]]'''

