[[section]]
title = "10. Conditionals & defaults"

  [[section.recipe]]
  title = "if / then / else"
  out = '''{"c":"big"}'''
  sqlpp = '''SELECT CASE WHEN 5 > 3 THEN "big" ELSE "small" END AS c'''
  sql = '''CASE WHEN 5 > 3 THEN 'big' ELSE 'small' END'''
  duckdb = '''if(5 > 3, 'big', 'small')'''
  js = '''5 > 3 ? "big" : "small"'''
  python = '''"big" if 5 > 3 else "small"'''
  mongo = '''{$cond: [{$gt:[5,3]}, "big", "small"]}'''
  jq = '''if . > 3 then "big" else "small" end'''

  [[section.recipe]]
  title = "Default for a missing/null value"
  note = "SQL++ splits what COALESCE and jq's // blur: IFMISSING / IFNULL / IFMISSINGORNULL treat absent and present-but-null differently."
  out = '''{"v":"default"}'''
  sqlpp = '''SELECT IFMISSINGORNULL(x.foo, "default") AS v FROM [{}] AS x'''
  sql = '''COALESCE(col->>'foo', 'default')'''
  duckdb = '''COALESCE(x.foo, 'default')'''
  js = '''x.foo ?? "default"'''
  python = '''x.get("foo", "default")'''
  mongo = '''{$ifNull: ["$foo", "default"]}'''
  jq = '''.foo // "default"'''

  [[section.recipe]]
  title = "Type guard (jq's try/catch)"
  note = "jq guards type errors with try/catch; SQL++ has no type errors — a bad op yields NULL/MISSING — so guard with CASE."
  out = '''{"a":1} then {}   (the string has no .a → MISSING)'''
  sqlpp = '''SELECT CASE WHEN TYPE(x) = "object" THEN x.a END AS a FROM [{"a":1}, "str"] AS x'''
  sql = '''—'''
  duckdb = '''—'''
  js = '''try { x.a } catch { null }'''
  python = '''x.get("a") if isinstance(x, dict) else None'''
  mongo = '''{$cond:[{$eq:[{$type:"$x"},"object"]}, "$x.a", null]}'''
  jq = '''try .a catch null'''
