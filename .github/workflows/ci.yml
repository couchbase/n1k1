name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * *'   # nightly full conformance sweep (09:17 UTC)

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # docs/recipes.{md,html} are GENERATED from docs/recipes.yaml. Regenerate and fail
  # if the committed copies drifted, so the published doc can never diverge from its
  # source of truth. The generator is pure stdlib -- no pip install, no Go.
  docs:
    name: docs (recipes generator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: recipes.md / recipes.html are up to date
        run: |
          python3 docs/recipes_build.py --all
          if ! git diff --quiet -- docs/recipes.md docs/recipes.html; then
            echo "::error::docs/recipes.{md,html} are stale -- run 'make recipes' and commit the result"
            git diff -- docs/recipes.md docs/recipes.html
            exit 1
          fi
          echo "generated docs match docs/recipes.yaml"

  # Build + test on all three OSes -- all of them BLOCKING.
  go:
    name: go / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      CGO_ENABLED: '0'   # n1k1 is pure Go; keeps the FAISS/cgo paths dark
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/bootstrap-go

      # The self-contained core: no n1ql tag, no cbq engine.
      - name: vet + build (core)
        run: |
          go vet ./...
          go build ./...
      - name: test (core)
        run: go test ./...

      # The cbq-engine integration layer + the CLI.
      - name: build (n1ql glue, test harness, CLI)
        run: go build -tags n1ql ./glue/... ./test/... ./cmd/n1k1
      # n1k1-trim: the smaller variant (~41MB vs ~102MB) that drops Parquet/Iceberg/
      # object-store via the `trim` tag (see DESIGN-cli.md). Build it on every OS to catch
      # build-tag rot -- a stub that drifts out of sync, or a new arrow/iceberg/aws import
      # leaking into the always-compiled path. Then run the trim unit suite (non-Windows;
      # the glue/CLI tests are quarantined there): it exercises the `!trim` tag on every
      # test file too, and confirms core behavior under the exclusions.
      - name: build (n1k1-trim variant)
        run: go build -tags "n1ql trim" -o n1k1-trim ./cmd/n1k1
      - name: test (n1k1-trim)
        if: matrix.os != 'windows-latest'
        run: go test -tags "n1ql trim" ./records/ ./cmd/n1k1
      # The glue/CLI test suites are not ported to Windows yet (22 failures across
      # several unrelated subsystems -- upstream iceberg-go's URI-based IO, tests that
      # embed a native `C:\...` path inside a SQL++ backquoted identifier where `\` is
      # an escape, the compiled-execution generators, and timing-sensitive stats
      # snapshots; see TODO.md "Windows port"). They are quarantined on Windows ONLY,
      # so everything above still gates there: bootstrap, vet, the core build AND core
      # tests, and the fact that glue/test/cmd all COMPILE for Windows.
      - name: test (glue)
        continue-on-error: ${{ matrix.os == 'windows-latest' }}
        run: go test -tags n1ql ./glue
      # Every cmd/n1k1 file is //go:build n1ql, so the untagged `go test ./...`
      # above silently skips the package -- run it explicitly with the tag.
      - name: test (CLI)
        continue-on-error: ${{ matrix.os == 'windows-latest' }}
        run: go test -tags n1ql ./cmd/n1k1

  # Cross-compile the BROWSER engine (GOOS=js/GOARCH=wasm) via web/wasm/build.sh, so a
  # dep bump or build-tag change that breaks the wasm build is caught in CI -- e.g. the
  # edsrzf/mmap-go v1.2.0 bump that added a colliding mmap_wasm.go, which silently broke
  # the demo until build.sh learned to skip its stub. One Linux runner suffices: the
  # output is GOOS=js regardless of the runner OS. This is what powers the (future)
  # browser SQL++ playground on Pages; see web/README.md + web/DESIGN.md.
  wasm:
    name: wasm build (browser engine)
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/bootstrap-go
      - name: build web/n1k1.wasm
        run: |
          set -euo pipefail
          sh web/wasm/build.sh
          test -f web/n1k1.wasm
          test -f web/wasm_exec.js
          ls -lh web/n1k1.wasm web/wasm_exec.js

      # Drive the actual playground (DOM + Web Worker + wasm + the "Try It Now" URL-hash
      # flow) in a real headless browser -- the layer jsdom can't reach and where the
      # shared-query-vs-sample ordering bug lived. Reuses the wasm just built above.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: browser tests (playground DOM + Web Worker + wasm)
        run: |
          set -euo pipefail
          cd web
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm test

  # Every SQL++ example in docs/recipes.yaml, executed against a freshly built CLI.
  # This is the automated test for the recipes doc. Linux only: the checker looks for
  # ./n1k1 at the repo root (n1k1.exe on Windows would simply be skipped).
  recipes-check:
    name: recipes (run every SQL++ example)
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/bootstrap-go
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: build the CLI
        run: go build -tags n1ql -o n1k1 ./cmd/n1k1
      - name: run every recipe
        run: python3 docs/recipes_build.py --check
      # The detector-recipe golden-fixture runner (hermetic: it builds its own temp
      # keyspaces, so the datastore argument is never actually queried).
      - name: .multi golden fixtures
        run: ./n1k1 -c '.multi test --queries cmd/n1k1/testdata/detectors' cmd/n1k1/testdata/detectors

  # The SQL++ conformance suites are long (many minutes), so they do not gate every
  # PR -- they run on master, nightly, and on demand.
  suite:
    name: conformance suite
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/bootstrap-go
      # Ordered exactly as the Makefile's test-suite-all: the generators emit Go
      # source into test/tmp/, which is then compiled and run as the compiled-mode
      # differential. The steps MUST stay in this order so test/tmp is never stale.
      - name: suite (interpreted + generators)
        run: go test -tags n1ql ./test
      - name: suite (compiled differential)
        run: |
          (cd test/tmp && go fmt ./... >/dev/null)
          go test -tags n1ql ./test/tmp
