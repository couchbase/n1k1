name: Bootstrap n1k1 Go build
description: >-
  Prepares a runner to build n1k1: the Go toolchain (version from go.mod), stub
  modules for go.mod's placeholder EE requires, and the generated intermed/.
  Needs no secrets -- every module the build actually reaches is public.

runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache-dependency-path: go.sum

    - name: Bootstrap (EE stubs, intermed/, test/tmp)
      shell: bash
      run: ./scripts/bootstrap.sh
